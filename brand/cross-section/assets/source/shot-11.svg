<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2560" height="1440" viewBox="0 0 2560 1440"><rect x="0" y="0" width="2560" height="1440" rx="0" fill="#F4F1E9"/><rect x="80" y="72" width="62" height="11" rx="0" fill="#B33930"/><text x="160" y="93" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="2" fill="#66625D">CROSS SECTION  /  EDITORIAL DESIGN SYSTEM</text><text x="2480" y="93" font-family="Noto Sans CJK TC, sans-serif" font-size="26" font-weight="600" letter-spacing="0" fill="#66625D" text-anchor="end">CASE 11   •   11 / 16</text><path d="M 80 119 L 2480 119" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="80" y="245" font-family="Noto Sans CJK TC, sans-serif" font-size="94" font-weight="700" letter-spacing="0" fill="#111111">表面不是最後一道工序</text><text x="84" y="299" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="400" letter-spacing="0" fill="#66625D">ISSUE 02  /  THE SURFACE IS NOT AN ENDING  /  CS-ART-004</text><path d="M 80 1361 L 2480 1361" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="80" y="1400" font-family="Noto Sans CJK TC, sans-serif" font-size="21" font-weight="500" letter-spacing="1" fill="#66625D">FLTL × HOWARD  /  INDEPENDENT CONCEPT PROJECT</text><text x="2480" y="1400" font-family="Noto Sans CJK TC, sans-serif" font-size="21" font-weight="500" letter-spacing="1" fill="#66625D" text-anchor="end">V5.4  /  ARTWORK REVIEW  /  NOT FOR RELEASE</text><rect x="85" y="370" width="1160" height="915" rx="0" fill="#FFFEFA" stroke="#C8C3B7" stroke-width="2"/><rect x="1270" y="370" width="1206" height="915" rx="0" fill="#FFFEFA" stroke="#C8C3B7" stroke-width="2"/><text x="133" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="24" font-weight="600" letter-spacing="0" fill="#66625D">CROSS SECTION     /     2026</text><text x="1194" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="0" fill="#66625D" text-anchor="end">02 — 04</text><path d="M 132 466 L 1193 466" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="135" y="552" font-family="Noto Serif CJK TC, serif" font-size="66" font-weight="700" letter-spacing="0" fill="#111111">表面不是最後一道工序</text><text x="135" y="607" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="600" letter-spacing="0" fill="#B33930">THE SURFACE IS NOT AN ENDING</text><text x="135" y="660" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="400" letter-spacing="0" fill="#66625D">CROSS SECTION 編輯部（虛構）</text><text x="137" y="732" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">材料常在完工照片裡被定格為一種顏色或紋理，但使用者真正接觸的是更複雜</text><text x="137" y="786" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">的經驗。扶手的溫度、地面在濕氣裡的反光、不同光源下的顆粒變化，都會使</text><text x="137" y="840" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">同一種材料顯現不同表情。</text><text x="137" y="921" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">本篇以紙張、石材、金屬與木質材料作為視覺研究對象。所有紋理與場景皆為</text><text x="137" y="975" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">概念示意，並非經過實驗室測試的性能結果。出版設計將特寫影像、材料註記</text><text x="137" y="1029" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">與大幅留白排列在同一個網格，讓讀者不只看到表面，也看見材料與使用情境</text><text x="137" y="1083" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">的關係。</text><text x="1330" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="0" fill="#66625D">ARCHITECTURAL CULTURE   /   EDITORIAL STUDY</text><path d="M 1330 469 L 2410 469" fill="none" stroke="#C8C3B7" stroke-width="2" /><rect x="1353" y="490" width="1028" height="370" rx="0" fill="#E6E2D8"/><path d="M 1378 510 L 1378 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1412 510 L 1412 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1446 510 L 1446 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1480 510 L 1480 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1514 510 L 1514 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1548 510 L 1548 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1582 510 L 1582 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1616 510 L 1616 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1650 510 L 1650 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1684 510 L 1684 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1718 510 L 1718 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1752 510 L 1752 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1786 510 L 1786 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1820 510 L 1820 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1854 510 L 1854 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1888 510 L 1888 840" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1378 530 L 2356 530" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1378 575 L 2356 575" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1378 620 L 2356 620" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1378 665 L 2356 665" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1378 710 L 2356 710" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1378 755 L 2356 755" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1378 800 L 2356 800" fill="none" stroke="#66625D" stroke-width="1" /><path d="M 1378 845 L 2356 845" fill="none" stroke="#66625D" stroke-width="1" /><rect x="1448" y="598" width="575.6800000000001" height="192.4" rx="0" fill="#B33930"/><text x="1350" y="940" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="700" letter-spacing="0" fill="#B33930">ENGLISH EDITION</text><text x="1350" y="985" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">A material is often frozen as a color or texture in completion photographs, while everyday experience</text><text x="1350" y="1017" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">is much less stable. The warmth of a handrail, reflections after rain, and changes under artificial light</text><text x="1350" y="1049" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">give the same surface many different readings.</text><text x="1350" y="1097" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">This fictional visual essay examines paper, stone, metal and timber through editorial compositions. The</text><text x="1350" y="1129" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">images and descriptions are conceptual, not laboratory-tested performance claims. Close-up</text><text x="1350" y="1161" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">photographs and careful annotations give materials room to be read as part of lived environments.</text><text x="137" y="1239" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="500" letter-spacing="0" fill="#66625D">PAGE  07</text><text x="2420" y="1239" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="500" letter-spacing="0" fill="#66625D" text-anchor="end">PAGE  08</text></svg>
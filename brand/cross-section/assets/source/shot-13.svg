<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2560" height="1440" viewBox="0 0 2560 1440"><rect x="0" y="0" width="2560" height="1440" rx="0" fill="#F4F1E9"/><rect x="80" y="72" width="62" height="11" rx="0" fill="#B33930"/><text x="160" y="93" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="2" fill="#66625D">CROSS SECTION  /  EDITORIAL DESIGN SYSTEM</text><text x="2480" y="93" font-family="Noto Sans CJK TC, sans-serif" font-size="26" font-weight="600" letter-spacing="0" fill="#66625D" text-anchor="end">CASE 11   •   13 / 16</text><path d="M 80 119 L 2480 119" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="80" y="245" font-family="Noto Sans CJK TC, sans-serif" font-size="94" font-weight="700" letter-spacing="0" fill="#111111">保存使用痕跡的理由</text><text x="84" y="299" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="400" letter-spacing="0" fill="#66625D">ISSUE 02  /  WHY TRACES MATTER  /  CS-ART-006</text><path d="M 80 1361 L 2480 1361" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="80" y="1400" font-family="Noto Sans CJK TC, sans-serif" font-size="21" font-weight="500" letter-spacing="1" fill="#66625D">FLTL × HOWARD  /  INDEPENDENT CONCEPT PROJECT</text><text x="2480" y="1400" font-family="Noto Sans CJK TC, sans-serif" font-size="21" font-weight="500" letter-spacing="1" fill="#66625D" text-anchor="end">V5.4  /  ARTWORK REVIEW  /  NOT FOR RELEASE</text><rect x="85" y="370" width="1160" height="915" rx="0" fill="#FFFEFA" stroke="#C8C3B7" stroke-width="2"/><rect x="1270" y="370" width="1206" height="915" rx="0" fill="#FFFEFA" stroke="#C8C3B7" stroke-width="2"/><text x="133" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="24" font-weight="600" letter-spacing="0" fill="#66625D">CROSS SECTION     /     2026</text><text x="1194" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="0" fill="#66625D" text-anchor="end">02 — 06</text><path d="M 132 466 L 1193 466" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="135" y="552" font-family="Noto Serif CJK TC, serif" font-size="66" font-weight="700" letter-spacing="0" fill="#111111">保存使用痕跡的理由</text><text x="135" y="607" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="600" letter-spacing="0" fill="#B33930">WHY TRACES MATTER</text><text x="135" y="660" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="400" letter-spacing="0" fill="#66625D">CROSS SECTION 編輯部（虛構）</text><text x="137" y="732" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">時間會在空間裡留下使用痕跡：桌面變得光滑的邊角、經常被觸摸的把手、被</text><text x="137" y="786" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">重新貼上的指示紙條。這些細節不一定符合剛完工時的照片，卻說明了人與場</text><text x="137" y="840" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">所如何長期相處。</text><text x="137" y="921" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">文化出版可以替這些細節留下位置。與其把每一段歷史寫成宏大的敘事，不如</text><text x="137" y="975" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">先把物件、材料與使用者的日常關係記錄清楚。CROSS SECTION 的第二期以</text><text x="137" y="1029" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">此收尾，提醒讀者：建築的價值除了設計完成那一刻，也存在於被使用、被修</text><text x="137" y="1083" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">繕與被重新理解的過程。</text><text x="1330" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="0" fill="#66625D">ARCHITECTURAL CULTURE   /   EDITORIAL STUDY</text><path d="M 1330 469 L 2410 469" fill="none" stroke="#C8C3B7" stroke-width="2" /><rect x="1353" y="490" width="1028" height="370" rx="0" fill="#E6E2D8"/><path d="M 1363 530 Q 1712.8 465, 2361 540" stroke="#B33930" stroke-width="3" fill="none"/><path d="M 1363 564 Q 1712.8 530, 2361 573" stroke="#66625D" stroke-width="3" fill="none"/><path d="M 1363 598 Q 1712.8 595, 2361 606" stroke="#66625D" stroke-width="3" fill="none"/><path d="M 1363 632 Q 1712.8 660, 2361 639" stroke="#B33930" stroke-width="3" fill="none"/><path d="M 1363 666 Q 1712.8 725, 2361 672" stroke="#66625D" stroke-width="3" fill="none"/><path d="M 1363 700 Q 1712.8 790, 2361 705" stroke="#66625D" stroke-width="3" fill="none"/><path d="M 1363 734 Q 1712.8 855, 2361 738" stroke="#B33930" stroke-width="3" fill="none"/><path d="M 1363 768 Q 1712.8 920, 2361 771" stroke="#66625D" stroke-width="3" fill="none"/><path d="M 1363 802 Q 1712.8 985, 2361 804" stroke="#66625D" stroke-width="3" fill="none"/><text x="1350" y="940" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="700" letter-spacing="0" fill="#B33930">ENGLISH EDITION</text><text x="1350" y="985" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">Time leaves visible traces in spaces: a polished edge of a shared table, a handle touched thousands of</text><text x="1350" y="1017" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">times, or a label carefully replaced. These details rarely appear in pristine completion photographs, yet</text><text x="1350" y="1049" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">they reveal how people and places continue to interact.</text><text x="1350" y="1097" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">Cultural publishing can hold space for these modest records. Rather than turning every detail into a</text><text x="1350" y="1129" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">grand narrative, it can document the relationship between objects, surfaces and everyday use. This</text><text x="1350" y="1161" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">fictional issue closes with the idea that a building continues to acquire meaning after its original design</text><text x="1350" y="1193" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">is finished.</text><text x="137" y="1239" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="500" letter-spacing="0" fill="#66625D">PAGE  011</text><text x="2420" y="1239" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="500" letter-spacing="0" fill="#66625D" text-anchor="end">PAGE  012</text></svg>
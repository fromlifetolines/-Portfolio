<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2560" height="1440" viewBox="0 0 2560 1440"><rect x="0" y="0" width="2560" height="1440" rx="0" fill="#F4F1E9"/><rect x="80" y="72" width="62" height="11" rx="0" fill="#B33930"/><text x="160" y="93" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="2" fill="#66625D">CROSS SECTION  /  EDITORIAL DESIGN SYSTEM</text><text x="2480" y="93" font-family="Noto Sans CJK TC, sans-serif" font-size="26" font-weight="600" letter-spacing="0" fill="#66625D" text-anchor="end">CASE 11   •   07 / 16</text><path d="M 80 119 L 2480 119" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="80" y="245" font-family="Noto Sans CJK TC, sans-serif" font-size="94" font-weight="700" letter-spacing="0" fill="#111111">門檻之間</text><text x="84" y="299" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="400" letter-spacing="0" fill="#66625D">ISSUE 01  /  BETWEEN THRESHOLDS  /  CS-ART-001</text><path d="M 80 1361 L 2480 1361" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="80" y="1400" font-family="Noto Sans CJK TC, sans-serif" font-size="21" font-weight="500" letter-spacing="1" fill="#66625D">FLTL × HOWARD  /  INDEPENDENT CONCEPT PROJECT</text><text x="2480" y="1400" font-family="Noto Sans CJK TC, sans-serif" font-size="21" font-weight="500" letter-spacing="1" fill="#66625D" text-anchor="end">V5.4  /  ARTWORK REVIEW  /  NOT FOR RELEASE</text><rect x="85" y="370" width="1160" height="915" rx="0" fill="#FFFEFA" stroke="#C8C3B7" stroke-width="2"/><rect x="1270" y="370" width="1206" height="915" rx="0" fill="#FFFEFA" stroke="#C8C3B7" stroke-width="2"/><text x="133" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="24" font-weight="600" letter-spacing="0" fill="#66625D">CROSS SECTION     /     2026</text><text x="1194" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="0" fill="#66625D" text-anchor="end">01 — 01</text><path d="M 132 466 L 1193 466" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="135" y="552" font-family="Noto Serif CJK TC, serif" font-size="66" font-weight="700" letter-spacing="0" fill="#111111">門檻之間</text><text x="135" y="607" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="600" letter-spacing="0" fill="#B33930">BETWEEN THRESHOLDS</text><text x="135" y="660" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="400" letter-spacing="0" fill="#66625D">CROSS SECTION 編輯部（虛構）</text><text x="137" y="732" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">一棟建築不只由牆、窗與樓層定義。真正改變人在空間裡感受的，往往是走進</text><text x="137" y="786" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">門的那幾秒。入口的高度、轉角的光線、腳步是否需要放慢，都會改寫訪客對</text><text x="137" y="840" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">公共與私密的理解。門檻因此不是單純的構造線，而是使用者與空間建立關係</text><text x="137" y="894" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">的起點。</text><text x="137" y="975" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">在本期的概念研究中，我們將門檻視為一組連續的提示。材質的切換可以告訴</text><text x="137" y="1029" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">人們正在進入新的區域；視線的收放則決定是否願意繼續探索。清楚的導覽不</text><text x="137" y="1083" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">必依賴大量標示，但也不能要求訪客憑直覺猜路。好的空間會讓資訊可被看見</text><text x="137" y="1137" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">，同時留下停留與觀察的餘裕。</text><text x="1330" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="0" fill="#66625D">ARCHITECTURAL CULTURE   /   EDITORIAL STUDY</text><path d="M 1330 469 L 2410 469" fill="none" stroke="#C8C3B7" stroke-width="2" /><rect x="1353" y="490" width="1028" height="370" rx="0" fill="#E6E2D8"/><rect x="1443" y="550" width="848" height="250" rx="0" fill="none" stroke="#111111" stroke-width="4"/><rect x="1491" y="575" width="752" height="200" rx="0" fill="none" stroke="#111111" stroke-width="4"/><rect x="1539" y="600" width="656" height="150" rx="0" fill="none" stroke="#111111" stroke-width="4"/><rect x="1587" y="625" width="560" height="100" rx="0" fill="none" stroke="#111111" stroke-width="4"/><rect x="1635" y="650" width="464" height="50" rx="0" fill="none" stroke="#111111" stroke-width="4"/><rect x="1897.8400000000001" y="510" width="143.92000000000002" height="330" rx="0" fill="#111111"/><text x="1350" y="940" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="700" letter-spacing="0" fill="#B33930">ENGLISH EDITION</text><text x="1350" y="985" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">Architecture is not defined only by walls, windows and floors. The first few seconds after entry can</text><text x="1350" y="1017" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">change how a place is understood. A change in height, a turn toward light, or a pause before the</text><text x="1350" y="1049" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">reception area can quietly explain the relationship between public and private space.</text><text x="1350" y="1097" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">In this fictional editorial study, we treat thresholds as a sequence of clues. Shifts in materials signal</text><text x="1350" y="1129" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">transitions. Openings and sightlines affect whether visitors feel invited to continue. Wayfinding does</text><text x="1350" y="1161" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">not require visual noise, yet it must never force people to guess where they belong.</text><text x="137" y="1239" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="500" letter-spacing="0" fill="#66625D">PAGE  01</text><text x="2420" y="1239" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="500" letter-spacing="0" fill="#66625D" text-anchor="end">PAGE  02</text></svg>
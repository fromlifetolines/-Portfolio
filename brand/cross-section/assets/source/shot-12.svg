<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2560" height="1440" viewBox="0 0 2560 1440"><rect x="0" y="0" width="2560" height="1440" rx="0" fill="#F4F1E9"/><rect x="80" y="72" width="62" height="11" rx="0" fill="#B33930"/><text x="160" y="93" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="2" fill="#66625D">CROSS SECTION  /  EDITORIAL DESIGN SYSTEM</text><text x="2480" y="93" font-family="Noto Sans CJK TC, sans-serif" font-size="26" font-weight="600" letter-spacing="0" fill="#66625D" text-anchor="end">CASE 11   •   12 / 16</text><path d="M 80 119 L 2480 119" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="80" y="245" font-family="Noto Sans CJK TC, sans-serif" font-size="94" font-weight="700" letter-spacing="0" fill="#111111">印刷網格與螢幕呼吸</text><text x="84" y="299" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="400" letter-spacing="0" fill="#66625D">ISSUE 02  /  GRIDS THAT BREATHE  /  CS-ART-005</text><path d="M 80 1361 L 2480 1361" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="80" y="1400" font-family="Noto Sans CJK TC, sans-serif" font-size="21" font-weight="500" letter-spacing="1" fill="#66625D">FLTL × HOWARD  /  INDEPENDENT CONCEPT PROJECT</text><text x="2480" y="1400" font-family="Noto Sans CJK TC, sans-serif" font-size="21" font-weight="500" letter-spacing="1" fill="#66625D" text-anchor="end">V5.4  /  ARTWORK REVIEW  /  NOT FOR RELEASE</text><rect x="85" y="370" width="1160" height="915" rx="0" fill="#FFFEFA" stroke="#C8C3B7" stroke-width="2"/><rect x="1270" y="370" width="1206" height="915" rx="0" fill="#FFFEFA" stroke="#C8C3B7" stroke-width="2"/><text x="133" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="24" font-weight="600" letter-spacing="0" fill="#66625D">CROSS SECTION     /     2026</text><text x="1194" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="0" fill="#66625D" text-anchor="end">02 — 05</text><path d="M 132 466 L 1193 466" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="135" y="552" font-family="Noto Serif CJK TC, serif" font-size="66" font-weight="700" letter-spacing="0" fill="#111111">印刷網格與螢幕呼吸</text><text x="135" y="607" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="600" letter-spacing="0" fill="#B33930">GRIDS THAT BREATHE</text><text x="135" y="660" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="400" letter-spacing="0" fill="#66625D">CROSS SECTION 編輯部（虛構）</text><text x="137" y="732" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">紙本雜誌的跨頁，容許讀者用視線在兩個頁面之間移動；手機卻要求內容在窄</text><text x="137" y="786" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">長的畫面裡依序出現。若把印刷版面直接縮小，字會失去比例，註解也容易擠</text><text x="137" y="840" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">在圖片旁邊。</text><text x="137" y="921" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">我們因此替 CROSS SECTION 建立兩套互相對應的編輯規則。紙本保留強烈的</text><text x="137" y="975" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">欄線、圖版與大標題；數位閱讀則讓內文維持舒適行長，圖註與延伸資料可以</text><text x="137" y="1029" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">獨立展開。這不是要讓兩種媒介長得一樣，而是確保同一篇文章在不同載體裡</text><text x="137" y="1083" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">仍有自己的閱讀節奏。</text><text x="1330" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="0" fill="#66625D">ARCHITECTURAL CULTURE   /   EDITORIAL STUDY</text><path d="M 1330 469 L 2410 469" fill="none" stroke="#C8C3B7" stroke-width="2" /><rect x="1353" y="490" width="1028" height="370" rx="0" fill="#E6E2D8"/><path d="M 1393 535 L 1393 815" fill="none" stroke="#C8C3B7" stroke-width="2" /><path d="M 1433 535 L 1433 815" fill="none" stroke="#C8C3B7" stroke-width="2" /><path d="M 1473 535 L 1473 815" fill="none" stroke="#C8C3B7" stroke-width="2" /><path d="M 1513 535 L 1513 815" fill="none" stroke="#C8C3B7" stroke-width="2" /><path d="M 1553 535 L 1553 815" fill="none" stroke="#C8C3B7" stroke-width="2" /><path d="M 1593 535 L 1593 815" fill="none" stroke="#C8C3B7" stroke-width="2" /><path d="M 1633 535 L 1633 815" fill="none" stroke="#C8C3B7" stroke-width="2" /><path d="M 1673 535 L 1673 815" fill="none" stroke="#C8C3B7" stroke-width="2" /><path d="M 1713 535 L 1713 815" fill="none" stroke="#C8C3B7" stroke-width="2" /><path d="M 1753 535 L 1753 815" fill="none" stroke="#C8C3B7" stroke-width="2" /><path d="M 1793 535 L 1793 815" fill="none" stroke="#C8C3B7" stroke-width="2" /><path d="M 1833 535 L 1833 815" fill="none" stroke="#C8C3B7" stroke-width="2" /><path d="M 1873 535 L 1873 815" fill="none" stroke="#C8C3B7" stroke-width="2" /><rect x="1433" y="574" width="868" height="202" rx="0" fill="#111111"/><rect x="1468" y="610" width="798" height="130" rx="0" fill="#F4F1E9"/><text x="1483" y="685" font-family="Noto Sans CJK TC, sans-serif" font-size="53" font-weight="700" letter-spacing="0" fill="#B33930">GRID</text><text x="1350" y="940" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="700" letter-spacing="0" fill="#B33930">ENGLISH EDITION</text><text x="1350" y="985" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">A print spread allows the eye to move across two facing pages. A phone asks the same material to</text><text x="1350" y="1017" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">unfold in a narrow sequence. Simply shrinking a print layout makes type fragile and captions difficult to</text><text x="1350" y="1049" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">place.</text><text x="1350" y="1097" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">CROSS SECTION therefore uses complementary editorial systems. Print relies on strong grids, image</text><text x="1350" y="1129" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">plates and large headings; digital reading keeps comfortable line lengths and gives captions their own</text><text x="1350" y="1161" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">space. The two experiences share an identity without becoming identical.</text><text x="137" y="1239" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="500" letter-spacing="0" fill="#66625D">PAGE  09</text><text x="2420" y="1239" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="500" letter-spacing="0" fill="#66625D" text-anchor="end">PAGE  010</text><rect x="1900" y="1180" width="490" height="45" rx="0" fill="#B33930"/><text x="1915" y="1211" font-family="Noto Sans CJK TC, sans-serif" font-size="19" font-weight="600" letter-spacing="0" fill="#FFFEFA">DIGITAL READER REFERENCE  →</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2560" height="1440" viewBox="0 0 2560 1440"><rect x="0" y="0" width="2560" height="1440" rx="0" fill="#F4F1E9"/><rect x="80" y="72" width="62" height="11" rx="0" fill="#B33930"/><text x="160" y="93" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="2" fill="#66625D">CROSS SECTION  /  EDITORIAL DESIGN SYSTEM</text><text x="2480" y="93" font-family="Noto Sans CJK TC, sans-serif" font-size="26" font-weight="600" letter-spacing="0" fill="#66625D" text-anchor="end">CASE 11   •   08 / 16</text><path d="M 80 119 L 2480 119" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="80" y="245" font-family="Noto Sans CJK TC, sans-serif" font-size="94" font-weight="700" letter-spacing="0" fill="#111111">城市邊界的日常尺度</text><text x="84" y="299" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="400" letter-spacing="0" fill="#66625D">ISSUE 01  /  THE EVERYDAY EDGE  /  CS-ART-002</text><path d="M 80 1361 L 2480 1361" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="80" y="1400" font-family="Noto Sans CJK TC, sans-serif" font-size="21" font-weight="500" letter-spacing="1" fill="#66625D">FLTL × HOWARD  /  INDEPENDENT CONCEPT PROJECT</text><text x="2480" y="1400" font-family="Noto Sans CJK TC, sans-serif" font-size="21" font-weight="500" letter-spacing="1" fill="#66625D" text-anchor="end">V5.4  /  ARTWORK REVIEW  /  NOT FOR RELEASE</text><rect x="85" y="370" width="1160" height="915" rx="0" fill="#FFFEFA" stroke="#C8C3B7" stroke-width="2"/><rect x="1270" y="370" width="1206" height="915" rx="0" fill="#FFFEFA" stroke="#C8C3B7" stroke-width="2"/><text x="133" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="24" font-weight="600" letter-spacing="0" fill="#66625D">CROSS SECTION     /     2026</text><text x="1194" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="0" fill="#66625D" text-anchor="end">01 — 02</text><path d="M 132 466 L 1193 466" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="135" y="552" font-family="Noto Serif CJK TC, serif" font-size="66" font-weight="700" letter-spacing="0" fill="#111111">城市邊界的日常尺度</text><text x="135" y="607" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="600" letter-spacing="0" fill="#B33930">THE EVERYDAY EDGE</text><text x="135" y="660" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="400" letter-spacing="0" fill="#66625D">CROSS SECTION 編輯部（虛構）</text><text x="137" y="732" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">街道的品質無法只靠鳥瞰圖判斷。街角的騎樓深度、雨天能否短暫避雨、等待</text><text x="137" y="786" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">朋友時是否有可停留的位置，這些看似微小的條件，才是日常生活與建築直接</text><text x="137" y="840" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">接觸的地方。</text><text x="137" y="921" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">我們把「邊界」當成觀察方法：記錄店面退縮、階梯與樹蔭如何影響行人的速</text><text x="137" y="975" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">度，也比較透明立面與封閉牆面帶來的視線差異。這不是城市調查成果，而是</text><text x="137" y="1029" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">為出版設計建立的一套示範閱讀框架。讀者可透過照片、文字與註解，重新辨</text><text x="137" y="1083" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">認每天經過卻沒有細看的街道。</text><text x="1330" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="0" fill="#66625D">ARCHITECTURAL CULTURE   /   EDITORIAL STUDY</text><path d="M 1330 469 L 2410 469" fill="none" stroke="#C8C3B7" stroke-width="2" /><rect x="1353" y="490" width="1028" height="370" rx="0" fill="#E6E2D8"/><path d="M 1383.0 515 L 1383.0 840" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1471.0 515 L 1471.0 840" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1559.0 515 L 1559.0 840" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1647.0 515 L 1647.0 840" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1735.0 515 L 1735.0 840" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1823.0 515 L 1823.0 840" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1911.0 515 L 1911.0 840" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1999.0 515 L 1999.0 840" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 2087.0 515 L 2087.0 840" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 2175.0 515 L 2175.0 840" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 2263.0 515 L 2263.0 840" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 2351.0 515 L 2351.0 840" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1375 510.0 L 2359 510.0" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1375 565.0 L 2359 565.0" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1375 620.0 L 2359 620.0" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1375 675.0 L 2359 675.0" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1375 730.0 L 2359 730.0" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1375 785.0 L 2359 785.0" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1375 840.0 L 2359 840.0" fill="none" stroke="#BAB5A8" stroke-width="2" /><path d="M 1403 790 L 1513 620 L 1593 700 L 1763 555 L 2311 550" stroke="#B33930" stroke-width="10" fill="none"/><text x="1350" y="940" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="700" letter-spacing="0" fill="#B33930">ENGLISH EDITION</text><text x="1350" y="985" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">The quality of a street cannot be read from an aerial image alone. Shelter from rain, a place to pause,</text><text x="1350" y="1017" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">or the depth of a small arcade can shape the daily relationship between buildings and pedestrians.</text><text x="1350" y="1065" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">This fictional editorial framework studies edges rather than landmarks. It asks readers to compare</text><text x="1350" y="1097" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">setbacks, shade and transparency, then notice how these conditions affect movement and attention.</text><text x="1350" y="1129" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">The purpose is to practice careful looking, not to claim a completed urban field study.</text><text x="137" y="1239" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="500" letter-spacing="0" fill="#66625D">PAGE  03</text><text x="2420" y="1239" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="500" letter-spacing="0" fill="#66625D" text-anchor="end">PAGE  04</text></svg>
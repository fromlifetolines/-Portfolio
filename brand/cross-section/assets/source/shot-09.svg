<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2560" height="1440" viewBox="0 0 2560 1440"><rect x="0" y="0" width="2560" height="1440" rx="0" fill="#F4F1E9"/><rect x="80" y="72" width="62" height="11" rx="0" fill="#B33930"/><text x="160" y="93" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="2" fill="#66625D">CROSS SECTION  /  EDITORIAL DESIGN SYSTEM</text><text x="2480" y="93" font-family="Noto Sans CJK TC, sans-serif" font-size="26" font-weight="600" letter-spacing="0" fill="#66625D" text-anchor="end">CASE 11   •   09 / 16</text><path d="M 80 119 L 2480 119" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="80" y="245" font-family="Noto Sans CJK TC, sans-serif" font-size="94" font-weight="700" letter-spacing="0" fill="#111111">留白是否也是一種導覽</text><text x="84" y="299" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="400" letter-spacing="0" fill="#66625D">ISSUE 01  /  CAN SILENCE GUIDE?  /  CS-ART-003</text><path d="M 80 1361 L 2480 1361" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="80" y="1400" font-family="Noto Sans CJK TC, sans-serif" font-size="21" font-weight="500" letter-spacing="1" fill="#66625D">FLTL × HOWARD  /  INDEPENDENT CONCEPT PROJECT</text><text x="2480" y="1400" font-family="Noto Sans CJK TC, sans-serif" font-size="21" font-weight="500" letter-spacing="1" fill="#66625D" text-anchor="end">V5.4  /  ARTWORK REVIEW  /  NOT FOR RELEASE</text><rect x="85" y="370" width="1160" height="915" rx="0" fill="#FFFEFA" stroke="#C8C3B7" stroke-width="2"/><rect x="1270" y="370" width="1206" height="915" rx="0" fill="#FFFEFA" stroke="#C8C3B7" stroke-width="2"/><text x="133" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="24" font-weight="600" letter-spacing="0" fill="#66625D">CROSS SECTION     /     2026</text><text x="1194" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="0" fill="#66625D" text-anchor="end">01 — 03</text><path d="M 132 466 L 1193 466" fill="none" stroke="#C8C3B7" stroke-width="2" /><text x="135" y="552" font-family="Noto Serif CJK TC, serif" font-size="66" font-weight="700" letter-spacing="0" fill="#111111">留白是否也是一種導覽</text><text x="135" y="607" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="600" letter-spacing="0" fill="#B33930">CAN SILENCE GUIDE?</text><text x="135" y="660" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="400" letter-spacing="0" fill="#66625D">CROSS SECTION 編輯部（虛構）</text><text x="137" y="732" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">展覽與公共空間常把資訊越放越多，彷彿每一面牆都必須解釋自己的功能。然</text><text x="137" y="786" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">而，人需要的不一定是更多文字。適當的留白，能讓最重要的方向訊息被辨識</text><text x="137" y="840" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">，也能提供停下來理解內容的節奏。</text><text x="137" y="921" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">編輯團隊以概念對話形式提出幾個問題：什麼資訊應該常駐？哪些內容適合放</text><text x="137" y="975" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">在點擊後才展開？手機導覽和現場標示應如何互補？答案不是移除說明，而是</text><text x="137" y="1029" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">重新安排閱讀順序。導覽系統若能讓第一次使用的人安心移動，就已經完成最</text><text x="137" y="1083" font-family="Noto Serif CJK TC, serif" font-size="29" font-weight="400" letter-spacing="0" fill="#111111">基本的工作。</text><text x="1330" y="444" font-family="Noto Sans CJK TC, sans-serif" font-size="25" font-weight="600" letter-spacing="0" fill="#66625D">ARCHITECTURAL CULTURE   /   EDITORIAL STUDY</text><path d="M 1330 469 L 2410 469" fill="none" stroke="#C8C3B7" stroke-width="2" /><rect x="1353" y="490" width="1028" height="370" rx="0" fill="#E6E2D8"/><rect x="1395" y="525" width="945" height="300" rx="0" fill="none" stroke="#B33930" stroke-width="3"/><rect x="1431" y="550" width="873" height="250" rx="0" fill="none" stroke="#66625D" stroke-width="3"/><rect x="1467" y="575" width="801" height="200" rx="0" fill="none" stroke="#B33930" stroke-width="3"/><rect x="1503" y="600" width="729" height="150" rx="0" fill="none" stroke="#66625D" stroke-width="3"/><rect x="1539" y="625" width="657" height="100" rx="0" fill="none" stroke="#B33930" stroke-width="3"/><rect x="1575" y="650" width="585" height="50" rx="0" fill="none" stroke="#66625D" stroke-width="3"/><rect x="1611" y="675" width="513" height="0" rx="0" fill="none" stroke="#B33930" stroke-width="3"/><rect x="1647" y="700" width="441" height="-50" rx="0" fill="none" stroke="#66625D" stroke-width="3"/><rect x="1683" y="725" width="369" height="-100" rx="0" fill="none" stroke="#B33930" stroke-width="3"/><rect x="1719" y="750" width="297" height="-150" rx="0" fill="none" stroke="#66625D" stroke-width="3"/><text x="1350" y="940" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="700" letter-spacing="0" fill="#B33930">ENGLISH EDITION</text><text x="1350" y="985" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">Exhibition spaces often accumulate information until every wall becomes an instruction. Yet readers</text><text x="1350" y="1017" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">and visitors do not always need more text. Deliberate empty space can reveal what matters, and it can</text><text x="1350" y="1049" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">make room for a slower moment of attention.</text><text x="1350" y="1097" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">This fictional editorial dialogue asks which messages should remain visible, which can appear on</text><text x="1350" y="1129" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">demand, and how a mobile guide should complement physical signage. Clarity is about sequence, not</text><text x="1350" y="1161" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#111111">simply about the volume of information.</text><text x="137" y="1239" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="500" letter-spacing="0" fill="#66625D">PAGE  05</text><text x="2420" y="1239" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="500" letter-spacing="0" fill="#66625D" text-anchor="end">PAGE  06</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="100%">
  <defs>
    <style>
      .cls-wine { fill: #8C2D26; }
      .text-title { font-family: 'Instrument Serif', Georgia, serif; font-size: 58px; font-weight: 400; letter-spacing: 0.10em; fill: #8C2D26; }
      .text-sub { font-family: 'Geist', -apple-system, sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: 0.32em; fill: #251C19; text-transform: uppercase; }
      .text-tagline { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 15px; letter-spacing: 0.18em; fill: #C65A47; }
    </style>
  </defs>

  <!-- FORNO 27 OFFICIAL PRIMARY HORIZONTAL LOCKUP (LOCKED MASTER) -->

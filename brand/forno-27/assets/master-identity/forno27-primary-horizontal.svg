<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <defs>
    <style>
      .cls-wine { fill: #8C2D26; }
      .cls-terracotta { fill: #C65A47; }
      .cls-ink { fill: #251C19; }
      .cls-cream { fill: #F1E7D4; }
      .text-title { font-family: 'Instrument Serif', Georgia, serif; font-size: 56px; font-weight: 400; letter-spacing: 0.08em; fill: #8C2D26; }
      .text-num { font-family: 'Instrument Serif', Georgia, serif; font-size: 56px; font-weight: 700; fill: #C65A47; }
      .text-sub { font-family: 'Geist', -apple-system, sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: 0.32em; fill: #251C19; }
      .text-tagline { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 14.5px; letter-spacing: 0.16em; fill: #4A5A3A; }
    </style>
  </defs>

  <!-- Horizontal Primary Logo Lockup -->
  <g transform="translate(40, 20)">
    <!-- Kiln Arch Mark -->
    <g transform="translate(0, 0)">
      <!-- Outer Arch Outline -->
      <path d="M 12,140 L 12,65 A 58,58 0 0,1 128,65 L 128,140 Z" fill="none" stroke="#8C2D26" stroke-width="4.5" />
      <!-- Radiating Sun / Oven Brick Notches -->
      <path d="M 24,140 L 24,72 A 46,46 0 0,1 116,72 L 116,140" fill="none" stroke="#8C2D26" stroke-width="1.5" stroke-dasharray="3,3" />
      <!-- Keystone -->
      <polygon points="65,12 75,12 73,26 67,26" fill="#8C2D26" />
      <!-- Solid Inner Fire Hearth -->
      <path d="M 38,140 L 38,82 A 32,32 0 0,1 102,82 L 102,140 Z" fill="#8C2D26" />
      <!-- Flame Negative Silhouette -->
      <path d="M 70,92 C 75,102 81,108 81,117 C 81,126 75,131 70,132 C 65,131 59,126 59,117 C 59,110 64,105 67,102 C 67,107 70,110 72,111 C 72,106 70,99 70,92 Z" fill="#F1E7D4" />
      <!-- Number 27 in Arch Tympanum -->
      <text x="70" y="58" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-size="22" font-weight="700" fill="#8C2D26" letter-spacing="0.04em">27</text>
      <!-- Base Horizon Step -->
      <rect x="4" y="140" width="132" height="6" fill="#8C2D26" rx="1.5" />
      <rect x="0" y="146" width="140" height="3" fill="#C65A47" rx="1" />
    </g>

    <!-- Wordmark & Subtitle -->
    <g transform="translate(175, 42)">
      <text x="0" y="24" class="text-title">FORNO <tspan class="text-num">27</tspan></text>
      <text x="4" y="60" class="text-sub">CONTEMPORARY PIZZERIA &amp; BAKERY</text>
      <line x1="4" y1="74" x2="430" y2="74" stroke="#251C19" stroke-opacity="0.16" stroke-width="1" />
      <text x="4" y="96" class="text-tagline">PIZZA · PANE · BUONA VITA</text>
      <text x="430" y="96" text-anchor="end" font-family="'Geist', sans-serif" font-size="10.5" letter-spacing="0.22em" fill="#6A625C">ROMA · TAIPEI</text>
    </g>
  </g>
</svg>

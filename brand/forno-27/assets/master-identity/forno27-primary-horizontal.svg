      <text x="4" y="58" class="text-sub">CONTEMPORARY PIZZERIA &amp; BAKERY</text>
      <line x1="4" y1="72" x2="480" y2="72" stroke="#251C19" stroke-opacity="0.18" stroke-width="1" />

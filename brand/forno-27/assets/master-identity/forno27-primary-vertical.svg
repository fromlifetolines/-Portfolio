<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="100%" height="100%">
  <defs>
    <style>
      .v-title { font-family: 'Instrument Serif', Georgia, serif; font-size: 54px; font-weight: 400; letter-spacing: 0.12em; fill: #8C2D26; text-anchor: middle; }
      .v-num { font-family: 'Instrument Serif', Georgia, serif; font-size: 54px; font-weight: 700; fill: #C65A47; }
      .v-sub { font-family: 'Geist', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.36em; fill: #251C19; text-anchor: middle; text-transform: uppercase; }
      .v-tag { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 15px; letter-spacing: 0.18em; fill: #4A5A3A; text-anchor: middle; }
      .v-meta { font-family: 'Geist', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.24em; fill: #6A625C; text-anchor: middle; }
    </style>
  </defs>

  <g transform="translate(250, 40)">
    <!-- Centered Arch Emblem -->
    <g transform="translate(-70, 0)">
      <!-- Outer Arch Outline -->
      <path d="M 12,140 L 12,65 A 58,58 0 0,1 128,65 L 128,140 Z" fill="none" stroke="#8C2D26" stroke-width="4.5" />
      <!-- Radiating Sun / Oven Brick Notches -->
      <path d="M 24,140 L 24,72 A 46,46 0 0,1 116,72 L 116,140" fill="none" stroke="#8C2D26" stroke-width="1.5" stroke-dasharray="3,3" />
      <!-- Keystone -->
      <polygon points="65,12 75,12 73,26 67,26" fill="#8C2D26" />
      <!-- Solid Inner Fire Hearth -->
      <path d="M 38,140 L 38,82 A 32,32 0 0,1 102,82 L 102,140 Z" fill="#8C2D26" />
      <!-- Flame Negative Silhouette -->
      <path d="M 70,92 C 75,102 81,108 81,117 C 81,126 75,131 70,132 C 65,131 59,126 59,117 C 59,110 64,105 67,102 C 67,107 70,110 72,111 C 72,106 70,99 70,92 Z" fill="#F1E7D4" />
      <!-- Number 27 in Arch Tympanum -->
      <text x="70" y="58" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-size="22" font-weight="700" fill="#8C2D26" letter-spacing="0.04em">27</text>
      <!-- Base Horizon Step -->
      <rect x="4" y="140" width="132" height="6" fill="#8C2D26" rx="1.5" />
      <rect x="0" y="146" width="140" height="3" fill="#C65A47" rx="1" />
    </g>

    <!-- Wordmark & Subtitle -->
    <g transform="translate(0, 205)">
      <text x="0" y="24" class="v-title">FORNO <tspan class="v-num">27</tspan></text>
      <text x="0" y="60" class="v-sub">CONTEMPORARY PIZZERIA &amp; BAKERY</text>
      
      <line x1="-120" y1="80" x2="120" y2="80" stroke="#251C19" stroke-opacity="0.18" stroke-width="1" />
      
      <text x="0" y="106" class="v-tag">PIZZA · PANE · BUONA VITA</text>
      <text x="0" y="132" class="v-meta">WOOD-FIRED FERMENTATION · EST. 2026</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <!-- Standalone Kiln Arch Mark -->
  <g transform="translate(30, 20)">
    <!-- Outer Arch Outline -->
    <path d="M 12,150 L 12,65 A 58,58 0 0,1 128,65 L 128,150 Z" fill="none" stroke="#8C2D26" stroke-width="5" />
    <!-- Radiating Sun / Oven Brick Notches -->
    <path d="M 24,150 L 24,72 A 46,46 0 0,1 116,72 L 116,150" fill="none" stroke="#8C2D26" stroke-width="1.8" stroke-dasharray="3,3" />
    <!-- Keystone -->
    <polygon points="65,12 75,12 73,26 67,26" fill="#8C2D26" />
    <!-- Solid Inner Fire Hearth -->
    <path d="M 38,150 L 38,82 A 32,32 0 0,1 102,82 L 102,150 Z" fill="#8C2D26" />
    <!-- Flame Negative Silhouette -->
    <path d="M 70,92 C 75,102 81,108 81,117 C 81,126 75,131 70,132 C 65,131 59,126 59,117 C 59,110 64,105 67,102 C 67,107 70,110 72,111 C 72,106 70,99 70,92 Z" fill="#F1E7D4" />
    <!-- Number 27 in Arch Tympanum -->
    <text x="70" y="58" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-size="22" font-weight="700" fill="#8C2D26" letter-spacing="0.04em">27</text>
    <!-- Base Horizon Step -->
    <rect x="4" y="150" width="132" height="7" fill="#8C2D26" rx="1.5" />
    <rect x="0" y="157" width="140" height="3" fill="#C65A47" rx="1" />
  </g>
</svg>

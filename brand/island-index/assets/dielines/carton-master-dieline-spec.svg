<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Noto+Serif+TC:wght@600;900&amp;display=swap');
      .bg { fill: #F7F5F0; }
      .cut-line { stroke: #121210; stroke-width: 1.5; fill: none; }
      .crease-line { stroke: #0077CC; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
      .bleed-line { stroke: #CC0066; stroke-width: 0.8; stroke-dasharray: 2 3; fill: none; opacity: 0.6; }
      .panel-bg { fill: #FFFFFF; }
      .glue-tab { fill: #EAE6DC; stroke: #121210; stroke-width: 1.2; }
      .deboss-zone { fill: rgba(58, 99, 81, 0.08); stroke: #3A6351; stroke-width: 1; stroke-dasharray: 2 2; }
      .foil-zone { fill: rgba(194, 59, 34, 0.08); stroke: #C23B22; stroke-width: 1; stroke-dasharray: 2 2; }
      .dim-text { font-family: 'Geist', sans-serif; font-size: 10px; font-weight: 600; fill: #CC0066; }
      .meta-lbl { font-family: 'Geist', sans-serif; font-size: 9px; font-weight: 600; fill: #6B6862; letter-spacing: 0.14em; }
      .tech-title { font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 700; fill: #121210; letter-spacing: 0.08em; }
    </style>
  </defs>

  <rect width="1200" height="850" class="bg" />

  <!-- HEADER -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" class="meta-lbl">PACKAGING ARCHITECTURE · DIELINE SPECIFICATION</text>
    <text x="0" y="24" class="tech-title">島序 單品茶盒結構展開圖 (RETAIL CARTON DIELINE V2.0)</text>
    <text x="0" y="42" font-family="'Geist', sans-serif" font-size="10px" fill="#6B6862">DIMENSIONS: W85 × D85 × H140 MM · MATERIAL: 350GSM TAKEO PACHICA · REVERSE TUCK-END</text>
    <line x1="0" y1="55" x2="1080" y2="55" stroke="#121210" stroke-width="1.8" />
  </g>

  <!-- DIELINE VISUALIZATION -->
  <g transform="translate(140, 160)">
    <!-- Legend Box -->
    <g transform="translate(720, 20)">
      <rect x="0" y="0" width="220" height="150" fill="#FFFFFF" stroke="#DDD9CF" stroke-width="1" />
      <g transform="translate(15, 20)">
        <text x="0" y="0" class="meta-lbl">ENGINEERING LEGEND</text>
        <line x1="0" y1="20" x2="40" y2="20" class="cut-line" />
        <text x="50" y="24" class="meta-lbl" fill="#121210">CUT LINE (裁切線)</text>

        <line x1="0" y1="45" x2="40" y2="45" class="crease-line" />
        <text x="50" y="49" class="meta-lbl" fill="#0077CC">CREASE / FOLD (壓痕折線)</text>

        <line x1="0" y1="70" x2="40" y2="70" class="bleed-line" />
        <text x="50" y="74" class="meta-lbl" fill="#CC0066">BLEED 3MM (出血位)</text>

        <rect x="0" y="90" width="40" height="15" class="deboss-zone" />
        <text x="50" y="102" class="meta-lbl" fill="#3A6351">BLIND DEBOSS (無色打凹)</text>

        <rect x="0" y="115" width="40" height="15" class="foil-zone" />
        <text x="50" y="127" class="meta-lbl" fill="#C23B22">MATTE FOIL (消光燙金)</text>
      </g>
    </g>

    <!-- Main Unrolled Carton Structure: 4 Panels + Glue Flap -->
    <!-- Glue Flap (15mm) -->
    <path d="M 0 100 L 25 75 L 25 425 L 0 400 Z" class="glue-tab" />
    <text x="12" y="250" font-family="'Geist', sans-serif" font-size="8px" fill="#6B6862" transform="rotate(-90, 12, 250)" text-anchor="middle">GLUE FLAP (15MM)</text>

    <!-- Panel 1: Left Side (W85 x H140mm -> scale 1.6: 136 x 224px, display approx 160 x 280) -->
    <!-- Using 150px = 85mm, 280px = 140mm -->
    <!-- Panel 1: Left Side -->
    <rect x="25" y="75" width="160" height="280" class="panel-bg" stroke="#121210" stroke-width="1.2" />
    <text x="105" y="120" text-anchor="middle" class="meta-lbl">LEFT PANEL / 側邊一</text>
    <text x="105" y="145" text-anchor="middle" font-family="'Geist', sans-serif" font-size="9px" fill="#6B6862">產區故事與沖泡指南</text>
    <rect x="45" y="170" width="120" height="140" fill="none" stroke="#DDD9CF" stroke-width="0.8" stroke-dasharray="2 2" />

    <!-- Panel 2: Front (主正面) -->
    <rect x="185" y="75" width="160" height="280" class="panel-bg" stroke="#121210" stroke-width="1.2" />
    <text x="265" y="105" text-anchor="middle" class="meta-lbl">FRONT PANEL / 主正面</text>
    <!-- Master Artwork Placement Zone -->
    <rect x="200" y="120" width="130" height="210" class="deboss-zone" />
    <text x="265" y="180" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="20px" fill="#3A6351">島序</text>
    <text x="265" y="205" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="14px" fill="#121210">高山烏龍</text>
    <text x="265" y="222" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8px" fill="#3A6351">1450M · ALISHAN</text>
    <rect x="250" y="250" width="30" height="30" class="foil-zone" />
    <text x="265" y="270" text-anchor="middle" font-family="'Geist', sans-serif" font-size="7px" fill="#C23B22">FOIL</text>

    <!-- Panel 3: Right Side (側邊二) -->
    <rect x="345" y="75" width="160" height="280" class="panel-bg" stroke="#121210" stroke-width="1.2" />
    <text x="425" y="120" text-anchor="middle" class="meta-lbl">RIGHT PANEL / 側邊二</text>
    <text x="425" y="145" text-anchor="middle" font-family="'Geist', sans-serif" font-size="9px" fill="#6B6862">防偽封籤跨接區</text>
    <rect x="395" y="75" width="60" height="280" fill="rgba(194, 59, 34, 0.05)" stroke="#C23B22" stroke-width="0.8" stroke-dasharray="2 3" />
    <text x="425" y="220" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8px" fill="#C23B22" transform="rotate(-90, 425, 220)">TAMPER-EVIDENT LABEL (22MM)</text>

    <!-- Panel 4: Back (背面規格) -->
    <rect x="505" y="75" width="160" height="280" class="panel-bg" stroke="#121210" stroke-width="1.2" />
    <text x="585" y="105" text-anchor="middle" class="meta-lbl">REAR PANEL / 背面</text>
    <text x="585" y="125" text-anchor="middle" font-family="'Geist', sans-serif" font-size="9px" fill="#6B6862">食品法規、批號與二維條碼</text>
    <rect x="525" y="145" width="120" height="180" fill="none" stroke="#DDD9CF" stroke-width="0.8" />
    <line x1="535" y1="170" x2="635" y2="170" stroke="#DDD9CF" />
    <line x1="535" y1="190" x2="635" y2="190" stroke="#DDD9CF" />
    <line x1="535" y1="210" x2="635" y2="210" stroke="#DDD9CF" />
    <rect x="560" y="240" width="50" height="35" fill="none" stroke="#121210" stroke-width="0.8" />
    <text x="585" y="260" text-anchor="middle" font-family="'Geist', sans-serif" font-size="6px" fill="#121210">BARCODE</text>

    <!-- Top Tuck Flap (Top of Front Panel) -->
    <path d="M 185 75 L 185 5 C 220 -15, 310 -15, 345 5 L 345 75 Z" class="panel-bg" stroke="#121210" stroke-width="1.2" />
    <line x1="185" y1="75" x2="345" y2="75" class="crease-line" />
    <text x="265" y="40" text-anchor="middle" class="meta-lbl">TOP TUCK FLAP / 頂蓋插舌</text>

    <!-- Top Dust Flaps (Over Side Panels) -->
    <path d="M 25 75 L 35 15 L 175 15 L 185 75 Z" fill="#F7F5F0" stroke="#121210" stroke-width="1" />
    <path d="M 345 75 L 355 15 L 495 15 L 505 75 Z" fill="#F7F5F0" stroke="#121210" stroke-width="1" />

    <!-- Bottom Closure Flaps -->
    <path d="M 185 355 L 185 435 C 220 455, 310 455, 345 435 L 345 355 Z" class="panel-bg" stroke="#121210" stroke-width="1.2" />
    <line x1="185" y1="355" x2="345" y2="355" class="crease-line" />
    <text x="265" y="400" text-anchor="middle" class="meta-lbl">BOTTOM FLAP / 底蓋</text>

    <!-- Bottom Dust Flaps -->
    <path d="M 25 355 L 35 415 L 175 415 L 185 355 Z" fill="#F7F5F0" stroke="#121210" stroke-width="1" />
    <path d="M 345 355 L 355 415 L 495 415 L 505 355 Z" fill="#F7F5F0" stroke="#121210" stroke-width="1" />

    <!-- Dimension Callouts -->
    <line x1="185" y1="465" x2="345" y2="465" stroke="#CC0066" stroke-width="1" />
    <text x="265" y="480" text-anchor="middle" class="dim-text">WIDTH: 85 MM</text>

    <line x1="700" y1="75" x2="700" y2="355" stroke="#CC0066" stroke-width="1" />
    <text x="715" y="220" class="dim-text" transform="rotate(90, 715, 220)" text-anchor="middle">HEIGHT: 140 MM</text>
  </g>
</svg>

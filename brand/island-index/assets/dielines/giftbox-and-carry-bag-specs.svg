<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=Noto+Serif+TC:wght@600;900&amp;display=swap');
      .bg { fill: #F7F5F0; }
      .meta-lbl { font-family: 'Geist', sans-serif; font-size: 8.5px; font-weight: 600; fill: #6B6862; letter-spacing: 0.16em; }
      .section-title { font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 700; fill: #121210; letter-spacing: 0.08em; }
      .box-outer { fill: #FFFFFF; stroke: #121210; stroke-width: 1.5; }
      .box-inner-slot { fill: #222220; stroke: #3A3A36; stroke-width: 1; }
      .obi-band { fill: #EAE6DC; stroke: #121210; stroke-width: 1; }
      .bag-body { fill: #F4F0E8; stroke: #B5B0A4; stroke-width: 1.2; }
      .dim-line { stroke: #CC0066; stroke-width: 0.9; stroke-dasharray: 2 3; }
      .dim-text { font-family: 'Geist', sans-serif; font-size: 9px; font-weight: 600; fill: #CC0066; }
    </style>
  </defs>

  <rect width="1200" height="850" class="bg" />

  <!-- HEADER -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" class="meta-lbl">GIFT ARCHITECTURE &amp; SECONDARY RETAIL TOUCHPOINTS</text>
    <text x="0" y="24" class="section-title">四入旗艦典藏禮盒與棉麻提袋結構規範 (W380×D200×H100MM GIFT BOX &amp; TOTE)</text>
    <line x1="0" y1="40" x2="1080" y2="40" stroke="#121210" stroke-width="1.6" />
  </g>

  <!-- MODULE 01: FOUR-CANISTER RIGID PRESENTATION BOX -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="620" height="340" fill="#FFFFFF" stroke="#DDD9CF" stroke-width="1" />
    <g transform="translate(25, 25)">
      <text x="0" y="0" class="meta-lbl">01 / RIGID PRESENTATION BOX (四入磁吸精裝木質/硬紙禮盒)</text>
      <text x="0" y="15" font-family="'Geist', sans-serif" font-size="9px" fill="#6B6862">
        外尺寸：W380 × D200 × H100 MM · 內襯高密度植絨客製凹槽 · 附風土等高線硫酸紙襯頁
      </text>

      <!-- 3D Box Perspective Layout -->
      <g transform="translate(20, 35)">
        <!-- Box Base (W380 x D200 scaled: 380 x 200px) -->
        <rect x="0" y="0" width="460" height="200" fill="#181816" rx="3" stroke="#121210" stroke-width="1.8" />
        
        <!-- 4 Canister Slots (Ø80mm scaled: 80px diameter circles/rectangles) -->
        <g transform="translate(25, 30)">
          <!-- Slot 1: Alishan Celadon -->
          <g transform="translate(0, 0)">
            <rect x="0" y="0" width="90" height="140" rx="45" fill="#252522" stroke="#3A6351" stroke-width="1.5" />
            <circle cx="45" cy="70" r="38" fill="#3A6351" opacity="0.35" />
            <text x="45" y="74" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8px" font-weight="700" fill="#FFFFFF">1450M</text>
            <text x="45" y="90" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="8px" fill="#FFFFFF">高山烏龍</text>
          </g>

          <!-- Slot 2: Emei Amber -->
          <g transform="translate(105, 0)">
            <rect x="0" y="0" width="90" height="140" rx="45" fill="#252522" stroke="#A65A38" stroke-width="1.5" />
            <circle cx="45" cy="70" r="38" fill="#A65A38" opacity="0.35" />
            <text x="45" y="74" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8px" font-weight="700" fill="#FFFFFF">0450M</text>
            <text x="45" y="90" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="8px" fill="#FFFFFF">東方美人</text>
          </g>

          <!-- Slot 3: Sun Moon Ruby -->
          <g transform="translate(210, 0)">
            <rect x="0" y="0" width="90" height="140" rx="45" fill="#252522" stroke="#8C2D19" stroke-width="1.5" />
            <circle cx="45" cy="70" r="38" fill="#8C2D19" opacity="0.35" />
            <text x="45" y="74" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8px" font-weight="700" fill="#FFFFFF">0750M</text>
            <text x="45" y="90" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="8px" fill="#FFFFFF">紅玉紅茶</text>
          </g>

          <!-- Slot 4: Dongding Umber -->
          <g transform="translate(315, 0)">
            <rect x="0" y="0" width="90" height="140" rx="45" fill="#252522" stroke="#524339" stroke-width="1.5" />
            <circle cx="45" cy="70" r="38" fill="#524339" opacity="0.35" />
            <text x="45" y="74" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8px" font-weight="700" fill="#FFFFFF">0800M</text>
            <text x="45" y="90" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="8px" fill="#FFFFFF">焙火烏龍</text>
          </g>
        </g>

        <!-- Cotton Linen Obi Band (W60mm wrap) -->
        <g transform="translate(500, 0)">
          <rect x="0" y="0" width="55" height="200" class="obi-band" />
          <line x1="5" y1="0" x2="5" y2="200" stroke="#121210" stroke-width="0.5" stroke-dasharray="2 3" />
          <line x1="50" y1="0" x2="50" y2="200" stroke="#121210" stroke-width="0.5" stroke-dasharray="2 3" />
          <text x="27" y="100" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="14px" fill="#121210" transform="rotate(90, 27, 100)">島序 · 風土典藏</text>
          <rect x="17" y="150" width="22" height="22" rx="2" fill="#C23B22" />
          <text x="28" y="164" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="6.5px" font-weight="900" fill="#FFFFFF">極選</text>
        </g>
      </g>

      <!-- Dimension Lines -->
      <line x1="20" y1="245" x2="480" y2="245" class="dim-line" />
      <text x="250" y="258" text-anchor="middle" class="dim-text">WIDTH: 380 MM</text>
    </g>
  </g>

  <!-- MODULE 02: LUXURY RETAIL CARRY BAG -->
  <g transform="translate(710, 110)">
    <rect x="0" y="0" width="430" height="340" fill="#FFFFFF" stroke="#DDD9CF" stroke-width="1" />
    <g transform="translate(25, 25)">
      <text x="0" y="0" class="meta-lbl">02 / COTTON-LINEN TOTE BAG (品牌實體手提袋)</text>
      <text x="0" y="15" font-family="'Geist', sans-serif" font-size="9px" fill="#6B6862">
        W400 × D220 × H300 MM · 16OZ 原色棉麻胚布 · 編織棉繩提把
      </text>

      <g transform="translate(50, 40)">
        <!-- Bag Body -->
        <rect x="0" y="30" width="280" height="200" class="bag-body" rx="2" />
        
        <!-- Braided Handles -->
        <path d="M 60 30 C 60 -15, 120 -15, 120 30" fill="none" stroke="#686358" stroke-width="4" stroke-linecap="round" />
        <path d="M 160 30 C 160 -15, 220 -15, 220 30" fill="none" stroke="#686358" stroke-width="4" stroke-linecap="round" />

        <!-- Blind Deboss / Screenprint Center Logo -->
        <g transform="translate(140, 110)">
          <!-- Geographic Contour Mini Mark -->
          <rect x="-25" y="-35" width="50" height="30" fill="none" stroke="#8E8879" stroke-width="0.8" />
          <line x1="0" y1="-35" x2="0" y2="-5" stroke="#8E8879" stroke-width="0.8" />
          <path d="M -15 -20 C -5 -25, 5 -15, 15 -20" fill="none" stroke="#8E8879" stroke-width="1" />
          
          <text x="0" y="10" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="20px" fill="#2E2C28" letter-spacing="0.2em">島序</text>
          <text x="0" y="24" text-anchor="middle" font-family="'Instrument Serif', serif" font-style="italic" font-size="12px" fill="#4A4740">Island Index</text>
          <text x="0" y="35" text-anchor="middle" font-family="'Geist', sans-serif" font-size="6px" fill="#787367" letter-spacing="0.24em">TAIWAN TERROIR ARCHIVE</text>
        </g>

        <!-- Base Elevation Stitch Line -->
        <line x1="20" y1="210" x2="260" y2="210" stroke="#B5B0A4" stroke-width="0.8" stroke-dasharray="3 3" />
      </g>
    </g>
  </g>

  <!-- MODULE 03: PACKAGING ASSEMBLY & CONTACT FIT CHECK -->
  <g transform="translate(60, 480)">
    <rect x="0" y="0" width="1080" height="320" fill="#FFFFFF" stroke="#DDD9CF" stroke-width="1" />
    <g transform="translate(25, 25)">
      <text x="0" y="0" class="meta-lbl">03 / GEOMETRIC FIT &amp; STRUCTURAL ENGINEERING AUDIT (包裝人機工程與容積密合性驗證)</text>
      
      <g transform="translate(10, 25)">
        <!-- Table Header -->
        <rect x="0" y="0" width="1020" height="28" fill="#F7F5F0" />
        <text x="20" y="18" class="meta-lbl" fill="#121210">包裝組件名稱</text>
        <text x="200" y="18" class="meta-lbl" fill="#121210">外觀尺寸 (W × D × H)</text>
        <text x="380" y="18" class="meta-lbl" fill="#121210">材料與磅數設定</text>
        <text x="600" y="18" class="meta-lbl" fill="#121210">加工工藝與防偽設定</text>
        <text x="840" y="18" class="meta-lbl" fill="#121210">容積公差與實體裝配狀態</text>

        <!-- Row 1 -->
        <g transform="translate(0, 35)">
          <line x1="0" y1="0" x2="1020" y2="0" stroke="#DDD9CF" stroke-width="0.8" />
          <text x="20" y="20" font-family="'Noto Serif TC', serif" font-weight="900" font-size="11px" fill="#121210">單品直立外盒</text>
          <text x="200" y="20" font-family="'Geist', sans-serif" font-size="10px">W85 × D85 × H140 mm</text>
          <text x="380" y="20" font-family="'Geist', sans-serif" font-size="10px">350gsm 竹尾 Pachica 特種紙</text>
          <text x="600" y="20" font-family="'Geist', sans-serif" font-size="10px">無色盲押 + 局部消光燙金 + 側邊封籤</text>
          <text x="840" y="20" font-family="'Geist', sans-serif" font-size="10px" fill="#3A6351">內置鋁罐淨間隙 +2.5mm，抽拉滑順</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(0, 75)">
          <line x1="0" y1="0" x2="1020" y2="0" stroke="#DDD9CF" stroke-width="0.8" />
          <text x="20" y="20" font-family="'Noto Serif TC', serif" font-weight="900" font-size="11px" fill="#121210">陽極氧化鋁罐</text>
          <text x="200" y="20" font-family="'Geist', sans-serif" font-size="10px">外徑 Ø80 mm × 高度 125 mm</text>
          <text x="380" y="20" font-family="'Geist', sans-serif" font-size="10px">1.2mm 食品級鋁合金 + 霧面噴砂</text>
          <text x="600" y="20" font-family="'Geist', sans-serif" font-size="10px">頂蓋雷射微雕 + 環形觸感棉紙標籤</text>
          <text x="840" y="20" font-family="'Geist', sans-serif" font-size="10px" fill="#3A6351">雙層緊配合氣密內蓋，隔絕氧氣濕氣</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(0, 115)">
          <line x1="0" y1="0" x2="1020" y2="0" stroke="#DDD9CF" stroke-width="0.8" />
          <text x="20" y="20" font-family="'Noto Serif TC', serif" font-weight="900" font-size="11px" fill="#121210">四入旗艦精裝禮盒</text>
          <text x="200" y="20" font-family="'Geist', sans-serif" font-size="10px">W380 × D200 × H100 mm</text>
          <text x="380" y="20" font-family="'Geist', sans-serif" font-size="10px">1200gsm 灰板外裱黑胡桃木紋紙</text>
          <text x="600" y="20" font-family="'Geist', sans-serif" font-size="10px">隱藏式強力磁吸 + 亞麻封條 + 朱紅金屬印</text>
          <text x="840" y="20" font-family="'Geist', sans-serif" font-size="10px" fill="#3A6351">精準開模 EVA 植絨托槽，防晃動緩震</text>
        </g>

        <!-- Row 4 -->
        <g transform="translate(0, 155)">
          <line x1="0" y1="0" x2="1020" y2="0" stroke="#DDD9CF" stroke-width="0.8" />
          <text x="20" y="20" font-family="'Noto Serif TC', serif" font-weight="900" font-size="11px" fill="#121210">棉麻旗艦提袋</text>
          <text x="200" y="20" font-family="'Geist', sans-serif" font-size="10px">W400 × D220 × H300 mm</text>
          <text x="380" y="20" font-family="'Geist', sans-serif" font-size="10px">16oz 粗紡原色棉麻胚布</text>
          <text x="600" y="20" font-family="'Geist', sans-serif" font-size="10px">環保水性絲網印 + 加厚底板補強</text>
          <text x="840" y="20" font-family="'Geist', sans-serif" font-size="10px" fill="#3A6351">完美平放單只禮盒或兩組單品外盒</text>
        </g>

        <!-- Compliance Note -->
        <g transform="translate(0, 205)">
          <line x1="0" y1="0" x2="1020" y2="0" stroke="#121210" stroke-width="1.2" />
          <text x="0" y="20" class="meta-lbl" fill="#C23B22">PROVISIONAL FEASIBILITY STATEMENT / 量產工程備忘</text>
          <text x="0" y="35" class="body-text" font-size="9px">
            *以上尺寸與容積公差係依據工業包裝標準實體配合原則計算，確保鋁罐（外徑 80mm）在外盒（內徑 82.5mm）中抽拉不卡滯；禮盒四槽間距保留 15mm 安全壁厚。在進入實體試打樣前，規格標記為 Provisional Concept Specification。
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>

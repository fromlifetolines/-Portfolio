      <text x="0" y="20" class="lbl">TEMP: 85°C – 88°C</text>
      <text x="0" y="34" class="lbl">RATIO: 1 : 30 (白毫條索)</text>
      <text x="0" y="48" class="lbl">TIME: 60s / 45s / 60s</text>

      <line x1="0" y1="65" x2="105" y2="65" class="rule" />

      <g transform="translate(15, 80)">
        <rect x="0" y="0" width="75" height="90" fill="#F7F5F0" stroke="#A65A38" stroke-width="0.8" />
        <rect x="3" y="3" width="69" height="84" fill="none" stroke="#A65A38" stroke-width="0.4" stroke-dasharray="2 2" />
        <text x="37" y="14" text-anchor="middle" font-family="'Geist', sans-serif" font-size="5px" fill="#A65A38">INDEX N° 02</text>
        <text x="37" y="42" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="16px" fill="#121210">島序</text>
        <rect x="48" y="18" width="12" height="12" rx="1" fill="#C23B22" />
        <text x="54" y="26" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="4.5px" font-weight="900" fill="#FFFFFF">極選</text>
        <text x="37" y="74" text-anchor="middle" font-family="'Geist', sans-serif" font-size="4.5px" fill="#A65A38">TAIWAN · 2026</text>
      </g>
    </g>
  </g>

  <!-- CANISTER LABEL 03: RUBY BLACK TEA & 04: ROASTED OOLONG (BOTTOM ROW) -->

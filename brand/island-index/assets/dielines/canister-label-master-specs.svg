      <text x="32" y="10" text-anchor="middle" font-family="'Geist', sans-serif" font-weight="700" font-size="7px" fill="#FFFFFF">SEQ 02 · 0450M</text>

      <text x="0" y="44" class="brand-title">島序</text>
      <text x="0" y="58" font-family="'Instrument Serif', serif" font-style="italic" font-size="12px" fill="#121210">Island Index</text>

      <text x="0" y="94" class="product-title">東方美人</text>
      <text x="0" y="110" font-family="'Geist', sans-serif" font-weight="600" font-size="9px" fill="#A65A38" letter-spacing="0.2em">ORIENTAL BEAUTY OOLONG</text>


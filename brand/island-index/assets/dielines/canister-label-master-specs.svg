      <rect x="500" y="0" width="10" height="230" class="glue-tab" />
      <rect x="0" y="0" width="500" height="8" fill="#8C2D19" />

      <g transform="translate(25, 30)">
        <text x="0" y="0" class="meta-eyebrow">03 / TERROIR ARCHIVE</text>
        <text x="0" y="18" font-family="'Noto Serif TC', serif" font-weight="900" font-size="13px" fill="#121210">南投 · 日月潭 湖盆</text>
        <text x="0" y="32" class="lbl">ELEVATION: 750 米 (Lakeside Basin)</text>
        <text x="0" y="46" class="lbl">CULTIVAR: 台茶 18 號 (TTES 18)</text>
        <text x="0" y="60" class="lbl">OXIDATION: 100% · ROAST: 0%</text>

        <path d="M 0 90 C 25 78, 55 105, 85 90 C 115 78, 130 95, 140 85" fill="none" stroke="#8C2D19" stroke-width="1.8" />
        <circle cx="85" cy="90" r="2.5" fill="#121210" />
        <text x="70" y="112" class="lbl">0750M CONTOUR</text>

        <text x="0" y="145" class="lbl">NOTES: 肉桂木香 · 野薄荷 · 紅熟果</text>
        <text x="0" y="160" class="lbl">BATCH: 2026 SUMMER HARVEST</text>
      </g>

      <line x1="180" y1="25" x2="180" y2="210" class="rule" />

      <g transform="translate(205, 35)">

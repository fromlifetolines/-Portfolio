      <text x="0" y="146" class="lbl">NATURAL CICADA-INDUCED</text>
      <text x="0" y="160" class="lbl">NET WT. 50G / 1.76 OZ</text>
    </g>

    <line x1="365" y1="25" x2="365" y2="210" class="rule" />


        <text x="0" y="20" class="lbl">TEMP: 98°C – 100°C</text>
        <text x="0" y="34" class="lbl">RATIO: 1 : 22 (熟火緊球)</text>
        <text x="0" y="48" class="lbl">TIME: 50s / 40s / 55s</text>

        <line x1="0" y1="65" x2="105" y2="65" class="rule" />


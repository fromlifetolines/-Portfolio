        <text x="0" y="18" font-family="'Noto Serif TC', serif" font-weight="900" font-size="13px" fill="#121210">南投 · 鹿谷 凍頂山</text>
        <text x="0" y="32" class="lbl">ELEVATION: 800 米 (Terraced Ridge)</text>
        <text x="0" y="46" class="lbl">CULTIVAR: 凍頂青心烏龍</text>
        <text x="0" y="60" class="lbl">OXIDATION: 35% · ROAST: 85%</text>

        <path d="M 0 90 C 30 102, 60 80, 90 92 C 115 104, 130 82, 140 90" fill="none" stroke="#524339" stroke-width="1.8" />
        <circle cx="90" cy="92" r="2.5" fill="#121210" />
        <text x="70" y="112" class="lbl">0800M CONTOUR</text>


        <text x="0" y="160" class="lbl">BATCH: 2026 AUTUMN ROAST</text>
      </g>

      <line x1="180" y1="25" x2="180" y2="210" class="rule" />

      <g transform="translate(205, 35)">
        <rect x="0" y="0" width="65" height="14" rx="2" fill="#524339" />
        <text x="32" y="10" text-anchor="middle" font-family="'Geist', sans-serif" font-weight="700" font-size="7px" fill="#FFFFFF">SEQ 04 · 0800M</text>

        <text x="0" y="44" class="brand-title">島序</text>
        <text x="0" y="58" font-family="'Instrument Serif', serif" font-style="italic" font-size="12px" fill="#121210">Island Index</text>

        <text x="0" y="94" class="product-title">焙火烏龍</text>
        <text x="0" y="110" font-family="'Geist', sans-serif" font-weight="600" font-size="9px" fill="#524339" letter-spacing="0.2em">ROASTED OOLONG (DONGDING)</text>

        <line x1="0" y1="130" x2="130" y2="130" class="rule" />

          <rect x="3" y="3" width="69" height="84" fill="none" stroke="#524339" stroke-width="0.4" stroke-dasharray="2 2" />
          <text x="37" y="14" text-anchor="middle" font-family="'Geist', sans-serif" font-size="5px" fill="#524339">INDEX N° 04</text>
          <text x="37" y="42" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="16px" fill="#121210">島序</text>

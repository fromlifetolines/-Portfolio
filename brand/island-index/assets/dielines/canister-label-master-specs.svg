<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=Noto+Serif+TC:wght@600;900&amp;display=swap');
      .bg { fill: #F7F5F0; }
      .label-base { fill: #FFFFFF; stroke: #121210; stroke-width: 1.2; }
      .meta-eyebrow { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 8.5px; fill: #6B6862; letter-spacing: 0.22em; }
      .section-title { font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 700; fill: #121210; letter-spacing: 0.08em; }
      .brand-title { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 24px; fill: #121210; letter-spacing: 0.18em; }
      .product-title { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 26px; fill: #121210; }
      .lbl { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 7.5px; fill: #6B6862; letter-spacing: 0.14em; }
      .val { font-family: 'Noto Serif TC', serif; font-weight: 600; font-size: 9.5px; fill: #121210; }
      .rule { stroke: #121210; stroke-width: 0.6; opacity: 0.2; }
      .glue-tab { fill: #EAE6DC; stroke: #121210; stroke-dasharray: 2 3; }
    </style>
  </defs>

  <rect width="1200" height="750" class="bg" />

  <!-- HEADER -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" class="meta-eyebrow">CANISTER WRAPAROUND LABEL SPECIFICATIONS · Ø80 × H125 MM</text>
    <text x="0" y="24" class="section-title">島序 鋁製氣密茶罐環形標籤展開規範 (W256 × H105 MM)</text>
    <text x="0" y="42" font-family="'Geist', sans-serif" font-size="10px" fill="#6B6862">ALUMINUM AIRTIGHT CANISTER · 360° WRAPAROUND TACTILE PAPER LABEL WITH 5MM GLUE SEAM</text>
    <line x1="0" y1="55" x2="1080" y2="55" stroke="#121210" stroke-width="1.8" />
  </g>

  <!-- CANISTER LABEL 01: HIGH MOUNTAIN OOLONG (CELADON) -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="510" height="230" class="label-base" />
    <!-- Overlap Glue Tab (5mm = 10px scaled) -->
    <rect x="500" y="0" width="10" height="230" class="glue-tab" />

    <!-- Color Accent Banner -->
    <rect x="0" y="0" width="500" height="8" fill="#3A6351" />

    <!-- Section 1: Left (Terroir & Elevation Axis) -->
    <g transform="translate(25, 30)">
      <text x="0" y="0" class="meta-eyebrow">01 / TERROIR ARCHIVE</text>
      <text x="0" y="18" font-family="'Noto Serif TC', serif" font-weight="900" font-size="13px" fill="#121210">嘉義 · 阿里山 樟樹湖</text>
      <text x="0" y="32" class="lbl">ELEVATION: 1,450 米 (Alpine Crest)</text>
      <text x="0" y="46" class="lbl">CULTIVAR: 青心烏龍 (Qingxin)</text>
      <text x="0" y="60" class="lbl">OXIDATION: 15% · ROAST: 0%</text>

      <path d="M 0 90 C 30 75, 60 105, 90 85 C 110 70, 130 95, 140 88" fill="none" stroke="#3A6351" stroke-width="1.8" />
      <circle cx="90" cy="85" r="2.5" fill="#121210" />
      <text x="70" y="112" class="lbl">1450M CONTOUR</text>

      <text x="0" y="145" class="lbl">NOTES: 幽蘭清露 · 鮮竹 · 山頭氣</text>
      <text x="0" y="160" class="lbl">BATCH: 2026 SPRING HARVEST</text>
    </g>

    <!-- Center Line Divider -->
    <line x1="180" y1="25" x2="180" y2="210" class="rule" />

    <!-- Section 2: Center Front Face (Primary Impact) -->
    <g transform="translate(205, 35)">
      <rect x="0" y="0" width="65" height="14" rx="2" fill="#3A6351" />
      <text x="32" y="10" text-anchor="middle" font-family="'Geist', sans-serif" font-weight="700" font-size="7px" fill="#FFFFFF">SEQ 01 · 1450M</text>

      <text x="0" y="44" class="brand-title">島序</text>
      <text x="0" y="58" font-family="'Instrument Serif', serif" font-style="italic" font-size="12px" fill="#121210">Island Index</text>

      <text x="0" y="94" class="product-title">高山烏龍</text>
      <text x="0" y="110" font-family="'Geist', sans-serif" font-weight="600" font-size="9px" fill="#3A6351" letter-spacing="0.2em">HIGH MOUNTAIN OOLONG</text>

      <line x1="0" y1="130" x2="130" y2="130" class="rule" />
      <text x="0" y="146" class="lbl">SINGLE ESTATE · TAIWAN</text>
      <text x="0" y="160" class="lbl">NET WT. 75G / 2.65 OZ</text>
    </g>

    <line x1="365" y1="25" x2="365" y2="210" class="rule" />

    <!-- Section 3: Right (Brewing Protocol & Authentication) -->
    <g transform="translate(385, 30)">
      <text x="0" y="0" class="meta-eyebrow">BREWING PROTOCOL</text>
      <text x="0" y="20" class="lbl">TEMP: 95°C – 98°C</text>
      <text x="0" y="34" class="lbl">RATIO: 1 : 20 (球型烏龍)</text>
      <text x="0" y="48" class="lbl">TIME: 50s / 40s / 60s</text>

      <line x1="0" y1="65" x2="105" y2="65" class="rule" />

      <!-- Seal Monogram -->
      <g transform="translate(15, 80)">
        <rect x="0" y="0" width="75" height="90" fill="#F7F5F0" stroke="#3A6351" stroke-width="0.8" />
        <rect x="3" y="3" width="69" height="84" fill="none" stroke="#3A6351" stroke-width="0.4" stroke-dasharray="2 2" />
        <text x="37" y="14" text-anchor="middle" font-family="'Geist', sans-serif" font-size="5px" fill="#3A6351">INDEX N° 01</text>
        <text x="37" y="42" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="16px" fill="#121210">島序</text>
        <rect x="48" y="18" width="12" height="12" rx="1" fill="#C23B22" />
        <text x="54" y="26" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="4.5px" font-weight="900" fill="#FFFFFF">極選</text>
        <text x="37" y="74" text-anchor="middle" font-family="'Geist', sans-serif" font-size="4.5px" fill="#3A6351">TAIWAN · 2026</text>
      </g>
    </g>
  </g>

  <!-- CANISTER LABEL 02: ORIENTAL BEAUTY (AMBER) -->
  <g transform="translate(630, 140)">
    <rect x="0" y="0" width="510" height="230" class="label-base" />
    <rect x="500" y="0" width="10" height="230" class="glue-tab" />
    <rect x="0" y="0" width="500" height="8" fill="#A65A38" />

    <g transform="translate(25, 30)">
      <text x="0" y="0" class="meta-eyebrow">02 / TERROIR ARCHIVE</text>
      <text x="0" y="18" font-family="'Noto Serif TC', serif" font-weight="900" font-size="13px" fill="#121210">新竹 · 峨眉 丘陵</text>
      <text x="0" y="32" class="lbl">ELEVATION: 450 米 (Foothills Mist)</text>
      <text x="0" y="46" class="lbl">CULTIVAR: 青心大冇 (Damo)</text>
      <text x="0" y="60" class="lbl">OXIDATION: 70% · ROAST: 10%</text>

      <path d="M 0 90 C 35 100, 65 75, 95 90 C 115 105, 130 80, 140 88" fill="none" stroke="#A65A38" stroke-width="1.8" />
      <circle cx="95" cy="90" r="2.5" fill="#121210" />
      <text x="70" y="112" class="lbl">0450M CONTOUR</text>

      <text x="0" y="145" class="lbl">NOTES: 野花蜜 · 麝香葡萄 · 木質</text>

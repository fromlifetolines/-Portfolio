        <text x="32" y="10" text-anchor="middle" font-family="'Geist', sans-serif" font-weight="700" font-size="7px" fill="#FFFFFF">SEQ 03 · 0750M</text>

        <text x="0" y="44" class="brand-title">島序</text>
        <text x="0" y="58" font-family="'Instrument Serif', serif" font-style="italic" font-size="12px" fill="#121210">Island Index</text>

        <text x="0" y="94" class="product-title">紅玉紅茶</text>
        <text x="0" y="110" font-family="'Geist', sans-serif" font-weight="600" font-size="9px" fill="#8C2D19" letter-spacing="0.2em">RUBY BLACK TEA (N°18)</text>

        <line x1="0" y1="130" x2="130" y2="130" class="rule" />
        <text x="0" y="146" class="lbl">ESTATE HARVEST · TAIWAN</text>
        <text x="0" y="160" class="lbl">NET WT. 60G / 2.11 OZ</text>
      </g>

      <line x1="365" y1="25" x2="365" y2="210" class="rule" />

      <g transform="translate(385, 30)">
        <text x="0" y="0" class="meta-eyebrow">BREWING PROTOCOL</text>
        <text x="0" y="20" class="lbl">TEMP: 90°C – 92°C</text>
        <text x="0" y="34" class="lbl">RATIO: 1 : 40 (條索紅茶)</text>
        <text x="0" y="48" class="lbl">TIME: 45s / 35s / 50s</text>

        <line x1="0" y1="65" x2="105" y2="65" class="rule" />

        <g transform="translate(15, 80)">
          <rect x="0" y="0" width="75" height="90" fill="#F7F5F0" stroke="#8C2D19" stroke-width="0.8" />
          <rect x="3" y="3" width="69" height="84" fill="none" stroke="#8C2D19" stroke-width="0.4" stroke-dasharray="2 2" />
          <text x="37" y="14" text-anchor="middle" font-family="'Geist', sans-serif" font-size="5px" fill="#8C2D19">INDEX N° 03</text>
          <text x="37" y="42" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="16px" fill="#121210">島序</text>
          <rect x="48" y="18" width="12" height="12" rx="1" fill="#C23B22" />
          <text x="54" y="26" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="4.5px" font-weight="900" fill="#FFFFFF">極選</text>
          <text x="37" y="74" text-anchor="middle" font-family="'Geist', sans-serif" font-size="4.5px" fill="#8C2D19">TAIWAN · 2026</text>
        </g>
      </g>
    </g>

    <!-- Label 04: Roasted Oolong -->
    <g transform="translate(570, 0)">
      <rect x="0" y="0" width="510" height="230" class="label-base" />
      <rect x="500" y="0" width="10" height="230" class="glue-tab" />
      <rect x="0" y="0" width="500" height="8" fill="#524339" />

      <g transform="translate(25, 30)">

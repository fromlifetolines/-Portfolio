<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=Noto+Serif+TC:wght@600;900&amp;display=swap');
      .bg { fill: #F7F5F0; }
      .carton-panel { fill: #FFFFFF; stroke: #DDD9CF; stroke-width: 1; }
      .meta-eyebrow { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 8px; fill: #6B6862; letter-spacing: 0.22em; }
      .brand-title { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 26px; fill: #121210; letter-spacing: 0.16em; }
      .product-title { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 28px; fill: #121210; letter-spacing: 0.08em; }
      .product-en { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 11px; fill: #A65A38; letter-spacing: 0.24em; }
      .meta-lbl { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 7.5px; fill: #6B6862; letter-spacing: 0.16em; }
      .meta-val { font-family: 'Noto Serif TC', serif; font-weight: 600; font-size: 10px; fill: #121210; }
      .body-desc { font-family: 'Geist', sans-serif; font-size: 8px; fill: #6B6862; line-height: 1.6; }
      .seal-tag { fill: #A65A38; }
      .seal-text { font-family: 'Geist', sans-serif; font-weight: 700; font-size: 7.5px; fill: #FFFFFF; letter-spacing: 0.12em; }
      .rule-line { stroke: #121210; stroke-width: 0.8; opacity: 0.18; }
      .chop { fill: #C23B22; }
    </style>
  </defs>

  <rect width="1000" height="500" class="bg" />

  <g transform="translate(50, 35)">
    <text x="0" y="0" class="meta-eyebrow">CARTON MASTER ARTWORK · SEQ 02 ORIENTAL BEAUTY OOLONG</text>
    <text x="0" y="20" font-family="'Noto Serif TC', serif" font-weight="900" font-size="18px" fill="#121210">東方美人 85×85×140mm 四面印刷母稿 (EMEI 0450M)</text>
    <line x1="0" y1="30" x2="900" y2="30" stroke="#121210" stroke-width="1.5" />
  </g>

  <g transform="translate(60, 95)">
    <!-- PANEL 1: LEFT SIDE -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="210" height="360" class="carton-panel" />
      <g transform="translate(20, 25)">
        <text x="0" y="0" class="meta-eyebrow">TERROIR ARCHIVE / 風土志</text>
        <text x="0" y="24" font-family="'Noto Serif TC', serif" font-weight="900" font-size="13px" fill="#121210">新竹 · 峨眉茶區</text>
        <text x="0" y="42" class="body-desc">
          座落於北台灣丘陵海拔 450 米處。夏季高溫濕潤，不噴灑農藥，引來小綠葉蟬刺吸著蜒，啟動茶樹防禦性芳香萜類化合物代謝，孕育天然熟蜜果香。
        </text>

        <line x1="0" y1="105" x2="170" y2="105" class="rule-line" />

        <text x="0" y="125" class="meta-eyebrow">BREWING PROTOCOL / 沖泡指引</text>
        <g transform="translate(0, 140)">
          <text x="0" y="0" class="meta-lbl">WATER TEMP / 水溫</text>
          <text x="0" y="14" class="meta-val">85°C – 88°C (溫潤柔沖)</text>

          <text x="90" y="0" class="meta-lbl">LEAF RATIO / 茶水比</text>
          <text x="90" y="14" class="meta-val">1 : 30 (條索型白毫)</text>
        </g>
        <g transform="translate(0, 185)">
          <text x="0" y="0" class="meta-lbl">INFUSION TIME / 浸泡時間</text>
          <text x="0" y="14" class="meta-val">一沖 60s · 二沖 45s · 三沖 60s</text>
        </g>

        <line x1="0" y1="235" x2="170" y2="235" class="rule-line" />
        <text x="0" y="255" class="meta-eyebrow">HARVEST BATCH / 採摘季別</text>
        <text x="0" y="270" class="meta-val">2026 SUMMER · 白毫五色手採</text>
      </g>
    </g>

    <!-- PANEL 2: FRONT -->
    <g transform="translate(225, 0)">
      <rect x="0" y="0" width="210" height="360" class="carton-panel" />
      <g transform="translate(20, 25)">
        <rect x="0" y="0" width="75" height="15" rx="2" class="seal-tag" />
        <text x="37" y="11" text-anchor="middle" class="seal-text">SEQ 02 · 0450M</text>

        <g transform="translate(0, 38)">
          <text x="0" y="22" class="brand-title">島序</text>
          <text x="0" y="34" font-family="'Instrument Serif', serif" font-style="italic" font-size="13px" fill="#121210">Island Index</text>
        </g>

        <g transform="translate(0, 95)">
          <text x="0" y="24" class="product-title">東方美人</text>
          <text x="0" y="40" class="product-en">ORIENTAL BEAUTY OOLONG</text>
          <text x="0" y="52" class="meta-lbl">NATURAL CICADA-INDUCED · SUMMER 2026</text>
        </g>

        <g transform="translate(0, 165)">
          <rect x="0" y="0" width="170" height="50" fill="none" stroke="#A65A38" stroke-width="0.8" stroke-dasharray="2 3" />
          <path d="M 10 35 C 45 42, 80 15, 110 35 C 140 50, 155 20, 165 30" fill="none" stroke="#A65A38" stroke-width="2.2" />
          <circle cx="110" cy="35" r="3" fill="#121210" />
          <text x="105" y="42" text-anchor="middle" class="meta-lbl">EMEI 0,450M CONTOUR</text>
        </g>

        <g transform="translate(0, 235)">
          <text x="0" y="0" class="meta-lbl">TERROIR: 新竹 峨眉 (Emei)</text>
          <text x="0" y="14" class="meta-lbl">CULTIVAR: 青心大冇 (Damo)</text>
          <text x="0" y="28" class="meta-lbl">OXIDATION: 70% · ROAST: 10% (輕焙)</text>
          <text x="0" y="42" class="meta-lbl">NOTES: 野花蜜 · 麝香葡萄 · 琥珀木質</text>
        </g>

        <line x1="0" y1="295" x2="170" y2="295" class="rule-line" />
        <g transform="translate(0, 310)">
          <text x="0" y="10" class="meta-lbl">NET WT. 50G / 1.76 OZ</text>
          <rect x="145" y="-5" width="25" height="20" fill="none" stroke="#A65A38" stroke-width="0.8" />
          <text x="157" y="5" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="7px" font-weight="900" fill="#A65A38">極選</text>
          <text x="157" y="12" text-anchor="middle" font-family="'Geist', sans-serif" font-size="5.5px" fill="#A65A38">0450M</text>
        </g>
      </g>
    </g>

    <!-- PANEL 3: RIGHT SIDE -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="210" height="360" class="carton-panel" />
      <g transform="translate(20, 25)">
        <text x="0" y="0" class="meta-eyebrow">AUTHENTICATION / 封籤檢驗</text>
        
        <g transform="translate(15, 30)">
          <rect x="0" y="0" width="140" height="230" fill="#F7F5F0" stroke="#A65A38" stroke-width="1.2" />
          <rect x="6" y="6" width="128" height="218" fill="none" stroke="#A65A38" stroke-width="0.6" stroke-dasharray="2 2" />

          <text x="70" y="30" text-anchor="middle" class="meta-lbl" fill="#A65A38">ISLAND INDEX ATLAS</text>
          <line x1="20" y1="40" x2="120" y2="40" stroke="#A65A38" stroke-width="0.6" />

          <text x="70" y="90" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="32px" fill="#121210">島</text>
          <line x1="40" y1="110" x2="100" y2="110" stroke="#A65A38" stroke-width="0.6" />
          <text x="70" y="160" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="32px" fill="#121210">序</text>

          <rect x="95" y="15" width="22" height="22" rx="2" class="chop" />
          <text x="106" y="29" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="7.5px" font-weight="900" fill="#FFFFFF">極選</text>

          <line x1="20" y1="185" x2="120" y2="185" stroke="#A65A38" stroke-width="0.6" />
          <text x="70" y="202" text-anchor="middle" class="meta-lbl" fill="#A65A38">CRAFTED IN TAIWAN</text>
        </g>

        <text x="0" y="295" class="body-desc" font-size="7.5px">
          *側邊封籤跨越盒蓋接縫，撕開即啟封，確保微氣候茶乾防潮封存完整。
        </text>
      </g>
    </g>

    <!-- PANEL 4: REAR -->
    <g transform="translate(675, 0)">
      <rect x="0" y="0" width="210" height="360" class="carton-panel" />
      <g transform="translate(20, 25)">
        <text x="0" y="0" class="meta-eyebrow">PRODUCT SPECIFICATION / 法規標示</text>

        <g transform="translate(0, 25)">
          <text x="0" y="0" class="meta-lbl">品名：島序 東方美人茶（白毫烏龍）</text>
          <text x="0" y="14" class="meta-lbl">成分：天然台灣茶葉 (Camellia sinensis)</text>
          <text x="0" y="28" class="meta-lbl">淨重：50 公克 (1.76 oz)</text>
          <text x="0" y="42" class="meta-lbl">產地：台灣 新竹縣峨眉茶區</text>
          <text x="0" y="56" class="meta-lbl">保存期限：常溫未開封 24 個月</text>
          <text x="0" y="70" class="meta-lbl">保存條件：置於陰涼乾燥處，避免高溫日照</text>
          <text x="0" y="84" class="meta-lbl">製造商：島序茶業有限公司 (概念標示)</text>
        </g>

        <line x1="0" y1="125" x2="170" y2="125" class="rule-line" />

        <text x="0" y="145" class="meta-eyebrow">CONCEPT SPECIFICATION</text>
        <text x="0" y="160" class="body-desc">
          本作品為 FLTL × HOWARD HUANG 自主品牌概念提案 (Self-Initiated Concept)，所有包裝尺寸與材質設定符合量產工程標準。
        </text>

        <g transform="translate(10, 215)">
          <rect x="0" y="0" width="150" height="65" fill="#FFFFFF" stroke="#121210" stroke-width="0.8" />
          <g transform="translate(15, 10)">
            <line x1="0" y1="0" x2="0" y2="35" stroke="#121210" stroke-width="2" />
            <line x1="6" y1="0" x2="6" y2="35" stroke="#121210" stroke-width="1.5" />
            <line x1="12" y1="0" x2="12" y2="35" stroke="#121210" stroke-width="3" />
            <line x1="20" y1="0" x2="20" y2="35" stroke="#121210" stroke-width="1" />
            <line x1="28" y1="0" x2="28" y2="35" stroke="#121210" stroke-width="2" />
            <line x1="36" y1="0" x2="36" y2="35" stroke="#121210" stroke-width="3" />
            <line x1="45" y1="0" x2="45" y2="35" stroke="#121210" stroke-width="1.5" />
            <line x1="55" y1="0" x2="55" y2="35" stroke="#121210" stroke-width="2" />
            <line x1="65" y1="0" x2="65" y2="35" stroke="#121210" stroke-width="1" />
            <line x1="75" y1="0" x2="75" y2="35" stroke="#121210" stroke-width="3" />
            <line x1="85" y1="0" x2="85" y2="35" stroke="#121210" stroke-width="1.5" />
            <line x1="95" y1="0" x2="95" y2="35" stroke="#121210" stroke-width="2" />
            <line x1="105" y1="0" x2="105" y2="35" stroke="#121210" stroke-width="1" />
            <line x1="115" y1="0" x2="115" y2="35" stroke="#121210" stroke-width="2" />
          </g>
          <text x="75" y="55" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8px" fill="#121210" letter-spacing="0.16em">4 719876 540450</text>
        </g>
      </g>
    </g>
  </g>
</svg>

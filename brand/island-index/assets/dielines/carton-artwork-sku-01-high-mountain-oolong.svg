<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=Noto+Serif+TC:wght@600;900&amp;display=swap');
      .bg { fill: #F7F5F0; }
      .carton-panel { fill: #FFFFFF; stroke: #DDD9CF; stroke-width: 1; }
      .meta-eyebrow { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 8px; fill: #6B6862; letter-spacing: 0.22em; }
      .brand-title { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 26px; fill: #121210; letter-spacing: 0.16em; }
      .product-title { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 28px; fill: #121210; letter-spacing: 0.08em; }
      .product-en { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 11px; fill: #3A6351; letter-spacing: 0.24em; }
      .meta-lbl { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 7.5px; fill: #6B6862; letter-spacing: 0.16em; }
      .meta-val { font-family: 'Noto Serif TC', serif; font-weight: 600; font-size: 10px; fill: #121210; }
      .body-desc { font-family: 'Geist', sans-serif; font-size: 8px; fill: #6B6862; line-height: 1.6; }
      .seal-tag { fill: #3A6351; }
      .seal-text { font-family: 'Geist', sans-serif; font-weight: 700; font-size: 7.5px; fill: #FFFFFF; letter-spacing: 0.12em; }
      .rule-line { stroke: #121210; stroke-width: 0.8; opacity: 0.18; }
      .chop { fill: #C23B22; }
    </style>
  </defs>

  <rect width="1000" height="500" class="bg" />

  <!-- HEADER -->
  <g transform="translate(50, 35)">
    <text x="0" y="0" class="meta-eyebrow">CARTON MASTER ARTWORK · SEQ 01 HIGH MOUNTAIN OOLONG</text>
    <text x="0" y="20" font-family="'Noto Serif TC', serif" font-weight="900" font-size="18px" fill="#121210">高山烏龍 85×85×140mm 四面印刷母稿 (ALISHAN 1450M)</text>
    <line x1="0" y1="30" x2="900" y2="30" stroke="#121210" stroke-width="1.5" />
  </g>

  <!-- 4-PANEL SPREAD (Each Panel: 200 x 360 px) -->
  <g transform="translate(60, 95)">
    <!-- PANEL 1: LEFT SIDE (Terroir Narrative & Brewing) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="210" height="360" class="carton-panel" />
      <g transform="translate(20, 25)">
        <text x="0" y="0" class="meta-eyebrow">TERROIR ARCHIVE / 風土志</text>
        <text x="0" y="24" font-family="'Noto Serif TC', serif" font-weight="900" font-size="13px" fill="#121210">阿里山 · 樟樹湖茶區</text>
        <text x="0" y="42" class="body-desc">
          座落於嘉義阿里山山脈海拔 1,450 米向陽陡坡。終年午後雲霧繚繞，日夜溫差劇烈，茶葉葉肉肥厚，富含天然果膠質。
        </text>

        <line x1="0" y1="105" x2="170" y2="105" class="rule-line" />

        <text x="0" y="125" class="meta-eyebrow">BREWING PROTOCOL / 沖泡指引</text>
        <g transform="translate(0, 140)">
          <text x="0" y="0" class="meta-lbl">WATER TEMP / 水溫</text>
          <text x="0" y="14" class="meta-val">95°C – 98°C</text>

          <text x="90" y="0" class="meta-lbl">LEAF RATIO / 茶水比</text>
          <text x="90" y="14" class="meta-val">1 : 20 (球型烏龍)</text>
        </g>
        <g transform="translate(0, 185)">
          <text x="0" y="0" class="meta-lbl">INFUSION TIME / 浸泡時間</text>
          <text x="0" y="14" class="meta-val">一沖 50s · 二沖 40s · 三沖 60s</text>
        </g>

        <line x1="0" y1="235" x2="170" y2="235" class="rule-line" />
        <text x="0" y="255" class="meta-eyebrow">HARVEST BATCH / 採摘季別</text>
        <text x="0" y="270" class="meta-val">2026 SPRING · 手採一心二葉</text>
      </g>
    </g>

    <!-- PANEL 2: FRONT (Primary Face) -->
    <g transform="translate(225, 0)">
      <rect x="0" y="0" width="210" height="360" class="carton-panel" />
      <g transform="translate(20, 25)">
        <!-- Top SKU Pill -->
        <rect x="0" y="0" width="75" height="15" rx="2" class="seal-tag" />
        <text x="37" y="11" text-anchor="middle" class="seal-text">SEQ 01 · 1450M</text>

        <!-- Brand Wordmark -->
        <g transform="translate(0, 38)">
          <text x="0" y="22" class="brand-title">島序</text>
          <text x="0" y="34" font-family="'Instrument Serif', serif" font-style="italic" font-size="13px" fill="#121210">Island Index</text>
        </g>

        <!-- Product Name & Terroir -->
        <g transform="translate(0, 95)">
          <text x="0" y="24" class="product-title">高山烏龍</text>
          <text x="0" y="40" class="product-en">HIGH MOUNTAIN OOLONG</text>
          <text x="0" y="52" class="meta-lbl">SINGLE ESTATE · SPRING HARVEST 2026</text>
        </g>

        <!-- Contour Graphic -->
        <g transform="translate(0, 165)">
          <rect x="0" y="0" width="170" height="50" fill="none" stroke="#3A6351" stroke-width="0.8" stroke-dasharray="2 3" />
          <path d="M 15 25 C 45 10, 75 40, 105 20 C 135 5, 155 35, 165 25" fill="none" stroke="#3A6351" stroke-width="2.2" />
          <circle cx="105" cy="20" r="3" fill="#121210" />
          <text x="105" y="42" text-anchor="middle" class="meta-lbl">ALISHAN 1,450M CONTOUR</text>
        </g>

        <!-- Specs Summary -->
        <g transform="translate(0, 235)">
          <text x="0" y="0" class="meta-lbl">TERROIR: 阿里山 樟樹湖 (Alishan)</text>
          <text x="0" y="14" class="meta-lbl">CULTIVAR: 青心烏龍 (Qingxin)</text>
          <text x="0" y="28" class="meta-lbl">OXIDATION: 15% · ROAST: 0% (清香)</text>
          <text x="0" y="42" class="meta-lbl">NOTES: 幽蘭清露 · 鮮竹 · 山頭氣</text>
        </g>

        <!-- Seal & Weight -->
        <line x1="0" y1="295" x2="170" y2="295" class="rule-line" />
        <g transform="translate(0, 310)">
          <text x="0" y="10" class="meta-lbl">NET WT. 75G / 2.65 OZ</text>
          <rect x="145" y="-5" width="25" height="20" fill="none" stroke="#3A6351" stroke-width="0.8" />
          <text x="157" y="5" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="7px" font-weight="900" fill="#3A6351">極選</text>
          <text x="157" y="12" text-anchor="middle" font-family="'Geist', sans-serif" font-size="5.5px" fill="#3A6351">1450M</text>
        </g>
      </g>
    </g>

    <!-- PANEL 3: RIGHT SIDE (Seal & Authentication) -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="210" height="360" class="carton-panel" />
      <g transform="translate(20, 25)">
        <text x="0" y="0" class="meta-eyebrow">AUTHENTICATION / 封籤檢驗</text>
        
        <!-- Tamper-evident Seal Graphic -->
        <g transform="translate(15, 30)">
          <rect x="0" y="0" width="140" height="230" fill="#F7F5F0" stroke="#3A6351" stroke-width="1.2" />
          <rect x="6" y="6" width="128" height="218" fill="none" stroke="#3A6351" stroke-width="0.6" stroke-dasharray="2 2" />

          <text x="70" y="30" text-anchor="middle" class="meta-lbl" fill="#3A6351">ISLAND INDEX ATLAS</text>
          <line x1="20" y1="40" x2="120" y2="40" stroke="#3A6351" stroke-width="0.6" />

          <text x="70" y="90" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="32px" fill="#121210">島</text>
          <line x1="40" y1="110" x2="100" y2="110" stroke="#3A6351" stroke-width="0.6" />
          <text x="70" y="160" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="32px" fill="#121210">序</text>

          <rect x="95" y="15" width="22" height="22" rx="2" class="chop" />
          <text x="106" y="29" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="7.5px" font-weight="900" fill="#FFFFFF">極選</text>

          <line x1="20" y1="185" x2="120" y2="185" stroke="#3A6351" stroke-width="0.6" />
          <text x="70" y="202" text-anchor="middle" class="meta-lbl" fill="#3A6351">CRAFTED IN TAIWAN</text>
        </g>

        <text x="0" y="295" class="body-desc" font-size="7.5px">
          *側邊封籤跨越盒蓋接縫，撕開即啟封，確保微氣候茶乾防潮封存完整。
        </text>
      </g>
    </g>

    <!-- PANEL 4: REAR (Food Regulation & Batch Barcode) -->
    <g transform="translate(675, 0)">
      <rect x="0" y="0" width="210" height="360" class="carton-panel" />
      <g transform="translate(20, 25)">
        <text x="0" y="0" class="meta-eyebrow">PRODUCT SPECIFICATION / 法規標示</text>

        <g transform="translate(0, 25)">
          <text x="0" y="0" class="meta-lbl">品名：島序 高山烏龍茶（散裝茶葉）</text>
          <text x="0" y="14" class="meta-lbl">成分：天然台灣茶葉 (Camellia sinensis)</text>
          <text x="0" y="28" class="meta-lbl">淨重：75 公克 (2.65 oz)</text>
          <text x="0" y="42" class="meta-lbl">產地：台灣 嘉義阿里山樟樹湖</text>
          <text x="0" y="56" class="meta-lbl">保存期限：常溫未開封 24 個月</text>
          <text x="0" y="70" class="meta-lbl">保存條件：置於陰涼乾燥處，避免高溫日照</text>
          <text x="0" y="84" class="meta-lbl">製造商：島序茶業有限公司 (概念標示)</text>
        </g>

        <line x1="0" y1="125" x2="170" y2="125" class="rule-line" />

        <text x="0" y="145" class="meta-eyebrow">CONCEPT SPECIFICATION</text>
        <text x="0" y="160" class="body-desc">
          本作品為 FLTL × HOWARD HUANG 自主品牌概念提案 (Self-Initiated Concept)，所有包裝尺寸與材質設定符合量產工程標準。
        </text>

        <!-- Barcode Box -->
        <g transform="translate(10, 215)">
          <rect x="0" y="0" width="150" height="65" fill="#FFFFFF" stroke="#121210" stroke-width="0.8" />
          <!-- Barcode vertical lines -->
          <g transform="translate(15, 10)">
            <line x1="0" y1="0" x2="0" y2="35" stroke="#121210" stroke-width="2" />
            <line x1="5" y1="0" x2="5" y2="35" stroke="#121210" stroke-width="1" />
            <line x1="9" y1="0" x2="9" y2="35" stroke="#121210" stroke-width="3" />
            <line x1="15" y1="0" x2="15" y2="35" stroke="#121210" stroke-width="1" />
            <line x1="20" y1="0" x2="20" y2="35" stroke="#121210" stroke-width="2" />
            <line x1="26" y1="0" x2="26" y2="35" stroke="#121210" stroke-width="1" />
            <line x1="32" y1="0" x2="32" y2="35" stroke="#121210" stroke-width="3" />
            <line x1="39" y1="0" x2="39" y2="35" stroke="#121210" stroke-width="1.5" />
            <line x1="46" y1="0" x2="46" y2="35" stroke="#121210" stroke-width="2" />
            <line x1="53" y1="0" x2="53" y2="35" stroke="#121210" stroke-width="1" />
            <line x1="60" y1="0" x2="60" y2="35" stroke="#121210" stroke-width="3" />
            <line x1="68" y1="0" x2="68" y2="35" stroke="#121210" stroke-width="1" />
            <line x1="75" y1="0" x2="75" y2="35" stroke="#121210" stroke-width="2" />
            <line x1="82" y1="0" x2="82" y2="35" stroke="#121210" stroke-width="1" />
            <line x1="90" y1="0" x2="90" y2="35" stroke="#121210" stroke-width="3" />
            <line x1="98" y1="0" x2="98" y2="35" stroke="#121210" stroke-width="1.5" />
            <line x1="105" y1="0" x2="105" y2="35" stroke="#121210" stroke-width="2" />
            <line x1="112" y1="0" x2="112" y2="35" stroke="#121210" stroke-width="1" />
            <line x1="120" y1="0" x2="120" y2="35" stroke="#121210" stroke-width="2" />
          </g>
          <text x="75" y="55" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8px" fill="#121210" letter-spacing="0.16em">4 719876 541450</text>
        </g>
      </g>
    </g>
  </g>
</svg>

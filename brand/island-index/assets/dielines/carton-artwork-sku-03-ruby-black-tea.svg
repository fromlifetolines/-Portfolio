<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=Noto+Serif+TC:wght@600;900&amp;display=swap');
      .bg { fill: #F7F5F0; }
      .carton-panel { fill: #FFFFFF; stroke: #DDD9CF; stroke-width: 1; }
      .meta-eyebrow { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 8px; fill: #6B6862; letter-spacing: 0.22em; }
      .brand-title { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 26px; fill: #121210; letter-spacing: 0.16em; }
      .product-title { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 28px; fill: #121210; letter-spacing: 0.08em; }
      .product-en { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 11px; fill: #8C2D19; letter-spacing: 0.24em; }
      .meta-lbl { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 7.5px; fill: #6B6862; letter-spacing: 0.16em; }
      .meta-val { font-family: 'Noto Serif TC', serif; font-weight: 600; font-size: 10px; fill: #121210; }
      .body-desc { font-family: 'Geist', sans-serif; font-size: 8px; fill: #6B6862; line-height: 1.6; }
      .seal-tag { fill: #8C2D19; }
      .seal-text { font-family: 'Geist', sans-serif; font-weight: 700; font-size: 7.5px; fill: #FFFFFF; letter-spacing: 0.12em; }
      .rule-line { stroke: #121210; stroke-width: 0.8; opacity: 0.18; }
      .chop { fill: #C23B22; }
    </style>
  </defs>

  <rect width="1000" height="500" class="bg" />

  <g transform="translate(50, 35)">
    <text x="0" y="0" class="meta-eyebrow">CARTON MASTER ARTWORK · SEQ 03 RUBY BLACK TEA (TTES N°18)</text>
    <text x="0" y="20" font-family="'Noto Serif TC', serif" font-weight="900" font-size="18px" fill="#121210">紅玉紅茶 85×85×140mm 四面印刷母稿 (SUN MOON 0750M)</text>
    <line x1="0" y1="30" x2="900" y2="30" stroke="#121210" stroke-width="1.5" />
  </g>

  <g transform="translate(60, 95)">
    <!-- PANEL 1: LEFT SIDE -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="210" height="360" class="carton-panel" />
      <g transform="translate(20, 25)">
        <text x="0" y="0" class="meta-eyebrow">TERROIR ARCHIVE / 風土志</text>
        <text x="0" y="24" font-family="'Noto Serif TC', serif" font-weight="900" font-size="13px" fill="#121210">南投 · 日月潭湖盆茶區</text>
        <text x="0" y="42" class="body-desc">
          座落於南投魚池鄉海拔 750 米之天然高山盆地。湖面蒸散豐富水氣，酸性紅土壤孕育台灣野生茶與緬甸大葉種雜交育種之紅玉，天生具備醇厚肉桂與薄荷清涼感。
        </text>

        <line x1="0" y1="105" x2="170" y2="105" class="rule-line" />

        <text x="0" y="125" class="meta-eyebrow">BREWING PROTOCOL / 沖泡指引</text>
        <g transform="translate(0, 140)">
          <text x="0" y="0" class="meta-lbl">WATER TEMP / 水溫</text>
          <text x="0" y="14" class="meta-val">90°C – 92°C (沸水降溫)</text>

          <text x="90" y="0" class="meta-lbl">LEAF RATIO / 茶水比</text>
          <text x="90" y="14" class="meta-val">1 : 40 (條索型紅茶)</text>
        </g>
        <g transform="translate(0, 185)">
          <text x="0" y="0" class="meta-lbl">INFUSION TIME / 浸泡時間</text>
          <text x="0" y="14" class="meta-val">一沖 45s · 二沖 35s · 三沖 50s</text>
        </g>

        <line x1="0" y1="235" x2="170" y2="235" class="rule-line" />
        <text x="0" y="255" class="meta-eyebrow">HARVEST BATCH / 採摘季別</text>
        <text x="0" y="270" class="meta-val">2026 SUMMER · 工夫手採單芽</text>
      </g>
    </g>

    <!-- PANEL 2: FRONT -->
    <g transform="translate(225, 0)">
      <rect x="0" y="0" width="210" height="360" class="carton-panel" />
      <g transform="translate(20, 25)">
        <rect x="0" y="0" width="75" height="15" rx="2" class="seal-tag" />
        <text x="37" y="11" text-anchor="middle" class="seal-text">SEQ 03 · 0750M</text>

        <g transform="translate(0, 38)">
          <text x="0" y="22" class="brand-title">島序</text>
          <text x="0" y="34" font-family="'Instrument Serif', serif" font-style="italic" font-size="13px" fill="#121210">Island Index</text>
        </g>

        <g transform="translate(0, 95)">
          <text x="0" y="24" class="product-title">紅玉紅茶</text>
          <text x="0" y="40" class="product-en">RUBY BLACK TEA (TTES N°18)</text>
          <text x="0" y="52" class="meta-lbl">ESTATE HARVEST · SUMMER 2026</text>
        </g>

        <g transform="translate(0, 165)">
          <rect x="0" y="0" width="170" height="50" fill="none" stroke="#8C2D19" stroke-width="0.8" stroke-dasharray="2 3" />
          <path d="M 20 25 C 50 12, 75 38, 105 25 C 135 15, 150 35, 165 20" fill="none" stroke="#8C2D19" stroke-width="2.2" />
          <circle cx="105" cy="25" r="3" fill="#121210" />
          <text x="105" y="42" text-anchor="middle" class="meta-lbl">SUN MOON 0,750M CONTOUR</text>
        </g>

        <g transform="translate(0, 235)">
          <text x="0" y="0" class="meta-lbl">TERROIR: 南投 日月潭 (Sun Moon)</text>
          <text x="0" y="14" class="meta-lbl">CULTIVAR: 台茶 18 號 (TTES 18)</text>
          <text x="0" y="28" class="meta-lbl">OXIDATION: 100% · ROAST: 0% (原香)</text>
          <text x="0" y="42" class="meta-lbl">NOTES: 肉桂木香 · 野薄荷 · 晶瑩紅熟果</text>
        </g>

        <line x1="0" y1="295" x2="170" y2="295" class="rule-line" />
        <g transform="translate(0, 310)">
          <text x="0" y="10" class="meta-lbl">NET WT. 60G / 2.11 OZ</text>
          <rect x="145" y="-5" width="25" height="20" fill="none" stroke="#8C2D19" stroke-width="0.8" />
          <text x="157" y="5" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="7px" font-weight="900" fill="#8C2D19">極選</text>
          <text x="157" y="12" text-anchor="middle" font-family="'Geist', sans-serif" font-size="5.5px" fill="#8C2D19">0750M</text>
        </g>
      </g>
    </g>

    <!-- PANEL 3: RIGHT SIDE -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="210" height="360" class="carton-panel" />
      <g transform="translate(20, 25)">
        <text x="0" y="0" class="meta-eyebrow">AUTHENTICATION / 封籤檢驗</text>
        
        <g transform="translate(15, 30)">
          <rect x="0" y="0" width="140" height="230" fill="#F7F5F0" stroke="#8C2D19" stroke-width="1.2" />
          <rect x="6" y="6" width="128" height="218" fill="none" stroke="#8C2D19" stroke-width="0.6" stroke-dasharray="2 2" />

          <text x="70" y="30" text-anchor="middle" class="meta-lbl" fill="#8C2D19">ISLAND INDEX ATLAS</text>
          <line x1="20" y1="40" x2="120" y2="40" stroke="#8C2D19" stroke-width="0.6" />

          <text x="70" y="90" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="32px" fill="#121210">島</text>
          <line x1="40" y1="110" x2="100" y2="110" stroke="#8C2D19" stroke-width="0.6" />
          <text x="70" y="160" text-anchor="middle" font-family="'Noto Serif TC', serif" font-weight="900" font-size="32px" fill="#121210">序</text>

          <rect x="95" y="15" width="22" height="22" rx="2" class="chop" />
          <text x="106" y="29" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="7.5px" font-weight="900" fill="#FFFFFF">極選</text>

          <line x1="20" y1="185" x2="120" y2="185" stroke="#8C2D19" stroke-width="0.6" />
          <text x="70" y="202" text-anchor="middle" class="meta-lbl" fill="#8C2D19">CRAFTED IN TAIWAN</text>
        </g>

        <text x="0" y="295" class="body-desc" font-size="7.5px">
          *側邊封籤跨越盒蓋接縫，撕開即啟封，確保微氣候茶乾防潮封存完整。
        </text>
      </g>
    </g>

    <!-- PANEL 4: REAR -->
    <g transform="translate(675, 0)">
      <rect x="0" y="0" width="210" height="360" class="carton-panel" />
      <g transform="translate(20, 25)">
        <text x="0" y="0" class="meta-eyebrow">PRODUCT SPECIFICATION / 法規標示</text>

        <g transform="translate(0, 25)">
          <text x="0" y="0" class="meta-lbl">品名：島序 紅玉紅茶（台茶18號）</text>
          <text x="0" y="14" class="meta-lbl">成分：天然台灣茶葉 (Camellia sinensis)</text>
          <text x="0" y="28" class="meta-lbl">淨重：60 公克 (2.11 oz)</text>
          <text x="0" y="42" class="meta-lbl">產地：台灣 南投縣魚池鄉日月潭</text>
          <text x="0" y="56" class="meta-lbl">保存期限：常溫未開封 36 個月 (紅茶醇化佳)</text>
          <text x="0" y="70" class="meta-lbl">保存條件：置於陰涼乾燥處，避免高溫日照</text>
          <text x="0" y="84" class="meta-lbl">製造商：島序茶業有限公司 (概念標示)</text>
        </g>

        <line x1="0" y1="125" x2="170" y2="125" class="rule-line" />

        <text x="0" y="145" class="meta-eyebrow">CONCEPT SPECIFICATION</text>
        <text x="0" y="160" class="body-desc">
          本作品為 FLTL × HOWARD HUANG 自主品牌概念提案 (Self-Initiated Concept)，所有包裝尺寸與材質設定符合量產工程標準。
        </text>

        <g transform="translate(10, 215)">
          <rect x="0" y="0" width="150" height="65" fill="#FFFFFF" stroke="#121210" stroke-width="0.8" />
          <g transform="translate(15, 10)">
            <line x1="0" y1="0" x2="0" y2="35" stroke="#121210" stroke-width="2" />
            <line x1="7" y1="0" x2="7" y2="35" stroke="#121210" stroke-width="1" />
            <line x1="14" y1="0" x2="14" y2="35" stroke="#121210" stroke-width="3" />
            <line x1="22" y1="0" x2="22" y2="35" stroke="#121210" stroke-width="1.5" />
            <line x1="30" y1="0" x2="30" y2="35" stroke="#121210" stroke-width="2" />
            <line x1="38" y1="0" x2="38" y2="35" stroke="#121210" stroke-width="3" />
            <line x1="48" y1="0" x2="48" y2="35" stroke="#121210" stroke-width="1" />
            <line x1="58" y1="0" x2="58" y2="35" stroke="#121210" stroke-width="2" />
            <line x1="68" y1="0" x2="68" y2="35" stroke="#121210" stroke-width="1" />
            <line x1="78" y1="0" x2="78" y2="35" stroke="#121210" stroke-width="3" />
            <line x1="88" y1="0" x2="88" y2="35" stroke="#121210" stroke-width="1.5" />
            <line x1="98" y1="0" x2="98" y2="35" stroke="#121210" stroke-width="2" />
            <line x1="108" y1="0" x2="108" y2="35" stroke="#121210" stroke-width="1" />
            <line x1="118" y1="0" x2="118" y2="35" stroke="#121210" stroke-width="2" />
          </g>
          <text x="75" y="55" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8px" fill="#121210" letter-spacing="0.16em">4 719876 540750</text>
        </g>
      </g>
    </g>
  </g>
</svg>

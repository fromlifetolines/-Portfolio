<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@500;600&amp;family=Noto+Serif+TC:wght@600;900&amp;display=swap');
      .bg { fill: #F7F5F0; }
      .seal-box { fill: none; stroke: #121210; stroke-width: 2.4; }
      .seal-inner { fill: none; stroke: #121210; stroke-width: 0.8; stroke-dasharray: 2 3; }
      .seal-kanji { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 56px; fill: #121210; }
      .vermilion-chop { fill: #C23B22; }
      .chop-text { font-family: 'Noto Serif TC', serif; font-size: 9.5px; font-weight: 900; fill: #FFFFFF; }
      .meta-label { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 9px; fill: #121210; letter-spacing: 0.22em; }
    </style>
  </defs>

  <rect width="320" height="480" class="bg" />

  <g transform="translate(60, 50)">
    <!-- Outer Solid Border -->
    <rect x="0" y="0" width="200" height="380" class="seal-box" />
    <!-- Inner Fine Dashed Grid -->
    <rect x="8" y="8" width="184" height="364" class="seal-inner" />

    <!-- Quality Chop (極選) -->
    <rect x="150" y="20" width="32" height="32" rx="2" class="vermilion-chop" />
    <text x="166" y="40" text-anchor="middle" class="chop-text">極選</text>

    <!-- Top Label -->
    <text x="90" y="38" text-anchor="middle" class="meta-label">INDEX N° 01</text>
    <line x1="20" y1="52" x2="180" y2="52" stroke="#121210" stroke-width="0.75" opacity="0.3" />

    <!-- Vertical Kanji: 島 and 序 -->
    <text x="100" y="145" text-anchor="middle" class="seal-kanji">島</text>
    <line x1="50" y1="185" x2="150" y2="185" stroke="#121210" stroke-width="0.8" opacity="0.25" />
    <text x="100" y="275" text-anchor="middle" class="seal-kanji">序</text>

    <!-- Base Origin Label -->
    <line x1="20" y1="315" x2="180" y2="315" stroke="#121210" stroke-width="0.75" opacity="0.3" />
    <text x="100" y="342" text-anchor="middle" class="meta-label">TAIWAN · 2026</text>
    <text x="100" y="358" text-anchor="middle" class="meta-label" font-size="7.5px" opacity="0.7">TERROIR ATLAS</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="600" height="850">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=Noto+Serif+TC:wght@600;900&amp;display=swap');
      .bg { fill: #121210; }
      .axis-main { stroke: #F7F5F0; stroke-width: 2.2; }
      .axis-sub { stroke: #F7F5F0; stroke-width: 0.8; stroke-dasharray: 2 4; opacity: 0.45; }
      .contour-1450 { stroke: #5D937B; stroke-width: 2.8; fill: none; stroke-linecap: round; }
      .contour-0800 { stroke: #998070; stroke-width: 2.4; fill: none; stroke-linecap: round; }
      .contour-0750 { stroke: #C94C34; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .contour-0450 { stroke: #D98359; stroke-width: 2.0; fill: none; stroke-linecap: round; }
      .node-core { fill: #F7F5F0; }
      .sym-num { font-family: 'Geist', sans-serif; font-size: 9px; font-weight: 600; fill: #F7F5F0; letter-spacing: 0.1em; opacity: 0.9; }
      
      .brand-kanji { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 72px; fill: #F7F5F0; letter-spacing: 0.28em; }
      .brand-latin-serif { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 38px; fill: #F7F5F0; letter-spacing: 0.08em; }
      .brand-latin-caps { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 11px; fill: #F7F5F0; letter-spacing: 0.38em; opacity: 0.9; }
      .meta-eyebrow { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 9px; fill: #A8A59E; letter-spacing: 0.26em; }
      .rule-line { stroke: #F7F5F0; stroke-width: 1; opacity: 0.2; }
      .vermilion-chop { fill: #C23B22; }
      .chop-text { font-family: 'Noto Serif TC', serif; font-size: 8.5px; font-weight: 900; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="600" height="850" class="bg" />

  <g transform="translate(180, 80)">
    <rect x="20" y="15" width="200" height="230" fill="none" stroke="#F7F5F0" stroke-width="1.6" />
    <line x1="20" y1="15" x2="220" y2="15" stroke="#F7F5F0" stroke-width="2.6" />
    
    <line x1="120" y1="0" x2="120" y2="245" class="axis-sub" />
    <line x1="120" y1="25" x2="120" y2="240" class="axis-main" />
    <polygon points="120,4 115,15 125,15" fill="#F7F5F0" />

    <!-- 1450m -->
    <path d="M 40 60 C 70 42, 95 78, 120 55 C 145 35, 175 72, 200 62" class="contour-1450" />
    <circle cx="120" cy="55" r="4" class="node-core" />
    <text x="228" y="65" class="sym-num">1450M</text>

    <!-- 0800m -->
    <path d="M 32 110 C 65 124, 95 98, 120 110 C 148 124, 178 95, 208 108" class="contour-0800" />
    <circle cx="120" cy="110" r="3.6" class="node-core" />
    <text x="228" y="113" class="sym-num">0800M</text>

    <!-- 0750m -->
    <path d="M 35 160 C 68 144, 98 172, 120 160 C 146 146, 176 176, 205 162" class="contour-0750" />
    <circle cx="120" cy="160" r="3.6" class="node-core" />
    <text x="228" y="163" class="sym-num">0750M</text>

    <!-- 0450m -->
    <path d="M 10 210 C 45 224, 82 195, 120 210 C 158 226, 192 196, 230 208" class="contour-0450" />
    <circle cx="120" cy="210" r="3.4" class="node-core" />
    <text x="228" y="212" class="sym-num">0450M</text>

    <text x="120" y="266" text-anchor="middle" class="sym-num">23°31'N · 120°48'E</text>
  </g>

  <g transform="translate(60, 420)">
    <line x1="240" y1="0" x2="240" y2="40" stroke="#F7F5F0" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 3" />

    <text x="240" y="70" text-anchor="middle" class="meta-eyebrow">A CONTEMPORARY TAIWANESE TEA ATLAS</text>

    <text x="240" y="155" text-anchor="middle" class="brand-kanji">島序</text>

    <rect x="365" y="105" width="28" height="28" rx="2" class="vermilion-chop" />
    <text x="379" y="123" text-anchor="middle" class="chop-text">極選</text>

    <text x="240" y="210" text-anchor="middle" class="brand-latin-serif">Island Index</text>
    <text x="240" y="234" text-anchor="middle" class="brand-latin-caps">TAIWANESE MOUNTAIN TEA</text>

    <line x1="80" y1="260" x2="400" y2="260" class="rule-line" />

    <g transform="translate(240, 290)">
      <text x="0" y="0" text-anchor="middle" class="meta-eyebrow">01 / 1450M · 02 / 0450M · 03 / 0750M · 04 / 0800M</text>
      <text x="0" y="24" text-anchor="middle" class="meta-eyebrow" opacity="0.6">CRAFTED &amp; SEALED AT ORIGIN · TAIWAN</text>
    </g>
  </g>
</svg>

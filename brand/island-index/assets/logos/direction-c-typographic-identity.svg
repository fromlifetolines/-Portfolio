<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;family=Noto+Serif+TC:wght@400;600;900&amp;display=swap');
      .bg { fill: #F8F6F0; }
      .seal-box { fill: none; stroke: #111111; stroke-width: 2.5; }
      .seal-inner { fill: none; stroke: #111111; stroke-width: 0.8; stroke-dasharray: 2 3; }
      .seal-kanji { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 46px; fill: #111111; }
      .vermilion-chop { fill: #C23B22; }
      .chop-text { font-family: 'Noto Serif TC', serif; font-size: 8px; font-weight: 900; fill: #FFFFFF; }
      .brand-kanji-display { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 64px; fill: #111111; letter-spacing: 0.22em; }
      .brand-en-serif { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 34px; fill: #111111; letter-spacing: 0.08em; }
      .brand-en-caps { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 11px; fill: #111111; letter-spacing: 0.36em; }
      .meta-label { font-family: 'Geist', sans-serif; font-weight: 500; font-size: 8.5px; fill: #7E7C77; letter-spacing: 0.16em; }
      .rule-line { stroke: #111111; stroke-width: 1; opacity: 0.2; }
    </style>
  </defs>

  <rect width="1000" height="450" class="bg" />

  <!-- MARK: Typographic Seal & Vertical Monogram (字序印鑑銘體) -->
  <g transform="translate(150, 95)">
    <!-- Architectural Double Column Seal Frame -->
    <rect x="25" y="15" width="150" height="230" class="seal-box" />
    <rect x="30" y="20" width="140" height="220" class="seal-inner" />

    <!-- Vermilion Red Quality Chop (朱紅印) -->
    <rect x="135" y="28" width="26" height="26" rx="2" class="vermilion-chop" />
    <text x="148" y="45" text-anchor="middle" class="chop-text">極選</text>

    <!-- Top Label -->
    <text x="100" y="42" text-anchor="middle" class="meta-label">INDEX N° 01</text>
    <line x1="38" y1="52" x2="128" y2="52" stroke="#111111" stroke-width="0.75" opacity="0.3" />

    <!-- Vertical Calligraphic Glyphs: 島 & 序 -->
    <text x="100" y="115" text-anchor="middle" class="seal-kanji">島</text>
    <line x1="60" y1="135" x2="140" y2="135" stroke="#111111" stroke-width="0.8" opacity="0.25" />
    <text x="100" y="195" text-anchor="middle" class="seal-kanji">序</text>

    <!-- Base Origin Label -->
    <line x1="38" y1="214" x2="162" y2="214" stroke="#111111" stroke-width="0.75" opacity="0.3" />
    <text x="100" y="230" text-anchor="middle" class="meta-label">TAIWAN · 2026</text>

    <!-- External Optical Guide Line -->
    <line x1="0" y1="130" x2="200" y2="130" stroke="#111111" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.15" />
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(430, 130)">
    <!-- Category Eyebrow -->
    <text x="0" y="24" class="meta-label">HERITAGE TERROIR ARCHIVE · CONTEMPORARY EASTERN DESIGN</text>

    <!-- Primary High-Contrast Serif Wordmark: 島 序 -->
    <text x="0" y="104" class="brand-kanji-display">島序</text>

    <!-- English Display Serif & Subtitle -->
    <text x="4" y="152" class="brand-en-serif">Island Index</text>
    <text x="240" y="148" class="brand-en-caps">TAIWANESE MOUNTAIN TEA</text>

    <!-- Systematic Divider -->
    <line x1="4" y1="178" x2="480" y2="178" class="rule-line" />

    <!-- Editorial Description Snippet -->
    <text x="4" y="202" class="meta-label">AN ARCHIVAL TEA COLLECTION CODIFYING ELEVATION, HARVEST &amp; CRAFTSMANSHIP</text>

    <!-- SKU Codes in Archival Grid -->
    <g transform="translate(4, 226)">
      <text x="0" y="0" class="meta-label">01 / ALISHAN 1450M</text>
      <text x="130" y="0" class="meta-label">02 / EMEI 0450M</text>
      <text x="250" y="0" class="meta-label">03 / SUN MOON 0750M</text>
      <text x="380" y="0" class="meta-label">04 / DONGDING 0800M</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;700&amp;family=Noto+Sans+TC:wght@400;700;900&amp;display=swap');
      .bg { fill: #FFFFFF; }
      .contour-1 { stroke: #000000; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .contour-2 { stroke: #000000; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .contour-3 { stroke: #000000; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .contour-4 { stroke: #000000; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .axis-line { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4 4; opacity: 0.4; }
      .elevation-pin { fill: #000000; }
      .elevation-tag { font-family: 'Geist', sans-serif; font-size: 8px; font-weight: 600; fill: #000000; letter-spacing: 0.1em; }
      .brand-kanji { font-family: 'Noto Sans TC', 'PingFang TC', sans-serif; font-weight: 900; font-size: 58px; fill: #000000; letter-spacing: 0.18em; }
      .brand-en { font-family: 'Geist', sans-serif; font-weight: 700; font-size: 20px; fill: #000000; letter-spacing: 0.38em; }
      .brand-sub { font-family: 'Geist', sans-serif; font-weight: 400; font-size: 9.5px; fill: #000000; letter-spacing: 0.28em; opacity: 0.8; }
      .meta-label { font-family: 'Geist', sans-serif; font-weight: 500; font-size: 8.5px; fill: #000000; letter-spacing: 0.16em; opacity: 0.6; }
    </style>
  </defs>

  <rect width="1000" height="450" class="bg" />

  <!-- MARK: Topographical Contour Monogram (B&W) -->
  <g transform="translate(140, 110)">
    <line x1="110" y1="10" x2="110" y2="210" class="axis-line" />

    <path d="M 20 185 C 45 195, 75 190, 110 185 C 145 180, 180 192, 200 185" class="contour-4" />
    <circle cx="20" cy="185" r="2.5" class="elevation-pin" />
    <text x="206" y="188" class="elevation-tag">450M</text>

    <path d="M 35 145 C 60 135, 85 152, 110 145 C 135 138, 165 148, 185 145" class="contour-3" />
    <circle cx="35" cy="145" r="2.5" class="elevation-pin" />
    <text x="191" y="148" class="elevation-tag">750M</text>

    <path d="M 50 105 C 75 115, 90 98, 110 105 C 130 112, 155 100, 170 105" class="contour-2" />
    <circle cx="50" cy="105" r="2.5" class="elevation-pin" />
    <text x="176" y="108" class="elevation-tag">800M</text>

    <path d="M 70 65 C 88 52, 98 72, 110 65 C 122 58, 138 70, 150 65" class="contour-1" />
    <circle cx="70" cy="65" r="3" class="elevation-pin" />
    <circle cx="110" cy="65" r="4" fill="#000000" />
    <text x="156" y="68" class="elevation-tag">1450M</text>

    <polygon points="110,28 116,40 104,40" fill="#000000" />

    <line x1="55" y1="42" x2="165" y2="42" stroke="#000000" stroke-width="2.5" stroke-linecap="square" />
    <line x1="55" y1="42" x2="55" y2="195" stroke="#000000" stroke-width="2" stroke-linecap="square" />
    <line x1="165" y1="42" x2="165" y2="195" stroke="#000000" stroke-width="2" stroke-linecap="square" />
    <line x1="45" y1="202" x2="175" y2="202" stroke="#000000" stroke-width="3.5" stroke-linecap="square" />

    <text x="110" y="224" text-anchor="middle" class="meta-label">23°31'N · 120°48'E</text>
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(430, 140)">
    <text x="0" y="24" class="meta-label">TERROIR ARCHIVE &amp; TEA TAXONOMY · TAIWAN</text>
    <text x="0" y="98" class="brand-kanji">島序</text>
    <text x="4" y="146" class="brand-en">ISLAND INDEX</text>
    <text x="4" y="176" class="brand-sub">PREMIUM TAIWANESE TEA ATELIER · EST. 2026</text>
    <line x1="4" y1="198" x2="480" y2="198" stroke="#000000" stroke-width="1" opacity="0.3" />

    <g transform="translate(4, 218)">
      <text x="0" y="0" class="meta-label">SEQ 01 · 1450M</text>
      <text x="120" y="0" class="meta-label">SEQ 02 · 0450M</text>
      <text x="240" y="0" class="meta-label">SEQ 03 · 0750M</text>
      <text x="360" y="0" class="meta-label">SEQ 04 · 0800M</text>
    </g>
  </g>
</svg>

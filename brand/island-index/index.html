<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROJECT UNDER REFINEMENT — 島序 ISLAND INDEX | FLTL × HOWARD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Noto+Serif+TC:wght@600;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0C0C0B;
      --card-bg: #141413;
      --border: #242422;
      --text: #FAF9F6;
      --muted: #8E8B82;
      --accent: #E2F547;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .refine-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-width: 580px;
      width: 100%;
      padding: clamp(32px, 6vw, 56px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Noto Serif TC', serif;
      font-weight: 900;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      color: #FAF9F6;
    }
    .sub-brand {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 1.25rem;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .divider {
      width: 48px;
      height: 1px;
      background: var(--border);
      margin: 0 auto 24px;
    }
    .desc {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #C5C2BA;
      margin-bottom: 16px;
    }
    .desc-en {
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 36px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      color: #0C0C0B;
      background: var(--accent);
      padding: 12px 24px;
      border-radius: 4px;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .back-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="refine-card">
    <div class="badge">PROJECT UNDER REFINEMENT</div>
    <h1>島序 ISLAND INDEX</h1>
    <div class="sub-brand">A Contemporary Taiwanese Tea Atlas</div>
    <div class="divider"></div>
    <p class="desc">
      本專案正進行高精準度實體模擬合成（Photorealistic Mockup Fidelity）全面修復與細節優化，即將重新恢復公開展示。
    </p>
    <p class="desc-en">
      This case study is currently undergoing high-fidelity photorealistic mockup restoration and will return shortly.
    </p>
    <a href="../../#helmets" class="back-btn">
      &larr; 返回作品集 / Return to Portfolio
    </a>
  </div>
</body>
</html>

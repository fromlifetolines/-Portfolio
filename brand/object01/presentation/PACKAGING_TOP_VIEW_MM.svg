<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -80 1200 950" width="1200" height="950" style="background:#0B0F19; font-family:'JetBrains Mono', 'SF Pro Text', -apple-system, sans-serif;">
  <defs>
    <style>
      .dim-line { stroke: #58A6FF; stroke-width: 1.2; stroke-dasharray: 4,3; }
      .dim-solid { stroke: #58A6FF; stroke-width: 1.2; }
      .dim-text { fill: #58A6FF; font-size: 11px; font-weight: 500; font-family: monospace; }
      .rib-line { stroke: #F59E0B; stroke-width: 1.5; }
      .rib-text { fill: #F59E0B; font-size: 11px; font-weight: bold; font-family: monospace; }
      .carton-outer { fill: none; stroke: #30363D; stroke-width: 2.5; }
      .carton-inner { fill: none; stroke: #484F58; stroke-width: 1.5; stroke-dasharray: 6,4; }
      .tray-border { fill: #161B22; stroke: #388BFD; stroke-width: 2; rx: 12px; }
      .cavity-fill { fill: #0D1117; stroke: #8B949E; stroke-width: 1.5; }
      .part-fill { fill: #21262D; stroke: #58A6FF; stroke-width: 1.8; opacity: 0.85; }
      .text-title { fill: #F0F6FC; font-size: 18px; font-weight: bold; }
      .text-sub { fill: #8B949E; font-size: 11px; }
      .text-legend { fill: #C9D1D9; font-size: 11px; }
      .badge-warn { fill: #F59E0B; font-size: 11px; font-weight: bold; }
    </style>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58A6FF" />
    </marker>
    <marker id="arrow-rib" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
  </defs>

  <!-- Scale: 1 mm = 2.0 px. Origin (0,0) at Tray Top-Left (X:0, Y:0) -->
  <!-- Tray: 410 mm W * 2 = 820 px. 310 mm D * 2 = 620 px -->
  <!-- Carton Inner: 430 mm W * 2 = 860 px (+20 px offset -> -20 to 840) -->
  <!-- Carton Outer: 436 mm W * 2 = 872 px (+26 px offset -> -26 to 846) -->

  <g transform="translate(80, 100)">

    <!-- Carton Outer (436 x 336 mm -> 872 x 672 px) -->
    <rect x="-26" y="-26" width="872" height="672" class="carton-outer" rx="8" />
    <text x="-26" y="-32" class="dim-text" fill="#8B949E">OUTER CARTON: 436 × 336 mm (B-Flute 3.0mm Corrugated)</text>

    <!-- Carton Inner (430 x 330 mm -> 860 x 660 px) -->
    <rect x="-20" y="-20" width="860" height="660" class="carton-inner" rx="6" />

    <!-- Perimeter Cushion Gap Indicators (10.0 mm -> 20 px) -->
    <line x1="-20" y1="310" x2="0" y2="310" stroke="#58A6FF" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <text x="-65" y="314" class="dim-text">10 mm</text>
    <line x1="820" y1="310" x2="840" y2="310" stroke="#58A6FF" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <text x="845" y="314" class="dim-text">10 mm</text>

    <!-- Tray Outline (410 x 310 mm -> 820 x 620 px) -->
    <rect x="0" y="0" width="820" height="620" class="tray-border" />
    <text x="10" y="-8" class="dim-text" fill="#388BFD">WET-PRESS PULP TRAY: 410 × 310 × 50 mm (R12mm Corner)</text>

    <!-- CAV-01: Base Cavity (Center 117, 117 mm -> 234, 234 px. Dia 194 mm -> 388 px. Radius 194 px) -->
    <!-- Bounding: [40 to 428, 40 to 428 px] -->
    <circle cx="234" cy="234" r="194" class="cavity-fill" />
    <!-- Finger notches -->
    <rect x="24" y="214" width="32" height="40" rx="6" fill="#0D1117" stroke="#8B949E" stroke-width="1" />
    <rect x="412" y="214" width="32" height="40" rx="6" fill="#0D1117" stroke="#8B949E" stroke-width="1" />
    <!-- Actual Part: Base O190 mm (Radius 190 px) -->
    <circle cx="234" cy="234" r="190" class="part-fill" />
    <!-- Base Details: Center Collar O26, Knob O20 -->
    <circle cx="234" cy="164" r="26" fill="#30363D" stroke="#58A6FF" stroke-width="1.2" />
    <circle cx="310" cy="278" r="20" fill="#30363D" stroke="#F59E0B" stroke-width="1.2" />
    <text x="165" y="238" fill="#F0F6FC" font-size="12" font-weight="bold">OBJ-01-A BASE</text>
    <text x="172" y="254" fill="#8B949E" font-size="10">Ø190 × 15 mm</text>

    <!-- CAV-02: Head Cavity (Center 318, 102 mm -> 636, 204 px. Dia 164 mm -> 328 px. Radius 164 px) -->
    <!-- Bounding: [472 to 800, 40 to 368 px] -->
    <circle cx="636" cy="204" r="164" class="cavity-fill" />
    <!-- Neck Relief Groove -->
    <rect x="618" y="360" width="36" height="30" rx="4" fill="#0D1117" stroke="#8B949E" stroke-width="1" />
    <!-- Actual Part: Head O160 mm (Radius 160 px) -->
    <circle cx="636" cy="204" r="160" class="part-fill" />
    <!-- Diffuser inner ring O146 mm (Radius 146 px) -->
    <circle cx="636" cy="204" r="146" fill="none" stroke="#8B949E" stroke-dasharray="3,3" stroke-width="1" />
    <text x="585" y="204" fill="#F0F6FC" font-size="12" font-weight="bold">OBJ-01-D HEAD</text>
    <text x="595" y="220" fill="#8B949E" font-size="10">Ø160 × 18 mm</text>

    <!-- RIB 1: Center Rib Between Base and Head (X: 428 to 472 px -> 44 px = 22.0 mm) -->
    <rect x="428" y="160" width="44" height="88" fill="#F59E0B" opacity="0.15" />
    <line x1="428" y1="204" x2="472" y2="204" class="rib-line" marker-start="url(#arrow-rib)" marker-end="url(#arrow-rib)" />
    <text x="432" y="196" class="rib-text">22.0 mm</text>
    <text x="435" y="222" fill="#F59E0B" font-size="9" font-weight="bold">RIB ≥12</text>

    <!-- CAV-03: Mast Channel (X: 20 to 310 mm -> 40 to 620 px. Y: 232 to 256 mm -> 464 to 512 px) -->
    <!-- Width 580 px (290 mm), Height 48 px (24 mm) -->
    <rect x="40" y="464" width="580" height="48" rx="8" class="cavity-fill" />
    <!-- Joint Deep Pocket at Left -->
    <rect x="40" y="458" width="64" height="60" rx="6" fill="#161B22" stroke="#8B949E" stroke-width="1" />
    <!-- Actual Part: Mast O14 x 265 mm -> 28 x 530 px -->
    <rect x="75" y="474" width="530" height="28" rx="4" class="part-fill" />
    <!-- Joint part -->
    <rect x="45" y="464" width="48" height="48" rx="4" fill="#30363D" stroke="#58A6FF" stroke-width="1.2" />
    <text x="240" y="492" fill="#F0F6FC" font-size="11" font-weight="bold">OBJ-01-B MAST (265 mm) + LOWER JOINT</text>

    <!-- RIB 2: Rib between Base and Mast Channel (Y: 428 to 464 px -> 36 px = 18.0 mm) -->
    <rect x="180" y="428" width="80" height="36" fill="#F59E0B" opacity="0.15" />
    <line x1="220" y1="428" x2="220" y2="464" class="rib-line" marker-start="url(#arrow-rib)" marker-end="url(#arrow-rib)" />
    <text x="228" y="450" class="rib-text">18.0 mm (RIB ≥12)</text>

    <!-- CAV-04: Cantilever Arm Channel (X: 20 to 295 mm -> 40 to 590 px. Y: 272 to 294 mm -> 544 to 588 px) -->
    <!-- Width 550 px (275 mm), Height 44 px (22 mm) -->
    <rect x="40" y="544" width="550" height="44" rx="8" class="cavity-fill" />
    <!-- Joint Deep Pocket at Left -->
    <rect x="40" y="538" width="56" height="56" rx="6" fill="#161B22" stroke="#8B949E" stroke-width="1" />
    <!-- Actual Part: Arm O12 x 240 mm -> 24 x 480 px -->
    <rect x="80" y="554" width="480" height="24" rx="4" class="part-fill" />
    <!-- Upper Joint part -->
    <rect x="45" y="544" width="44" height="44" rx="4" fill="#30363D" stroke="#58A6FF" stroke-width="1.2" />
    <text x="230" y="571" fill="#F0F6FC" font-size="11" font-weight="bold">OBJ-01-C CANTILEVER ARM (240 mm) + UPPER JOINT</text>

    <!-- RIB 3: Rib between Mast and Arm Channel (Y: 512 to 544 px -> 32 px = 16.0 mm) -->
    <rect x="180" y="512" width="80" height="32" fill="#F59E0B" opacity="0.15" />
    <line x1="220" y1="512" x2="220" y2="544" class="rib-line" marker-start="url(#arrow-rib)" marker-end="url(#arrow-rib)" />
    <text x="228" y="532" class="rib-text">16.0 mm (RIB ≥12)</text>

    <!-- CAV-05: Accessories & Power Supply (X: 322 to 397 mm -> 644 to 794 px. Y: 232 to 294 mm -> 464 to 588 px) -->
    <!-- Width 150 px (75 mm), Height 124 px (62 mm) -->
    <rect x="644" y="464" width="150" height="124" rx="8" class="cavity-fill" />
    <!-- Adapter & Coiled Cable Parts -->
    <rect x="656" y="474" width="126" height="50" rx="4" class="part-fill" />
    <circle cx="719" cy="554" r="24" fill="#30363D" stroke="#58A6FF" stroke-width="1.2" />
    <text x="662" y="504" fill="#F0F6FC" font-size="10" font-weight="bold">POWER ADAPTER</text>
    <text x="685" y="558" fill="#8B949E" font-size="9">CABLE</text>

    <!-- RIB 4: Rib between Channels and Accessories (X: 620 to 644 px -> 24 px = 12.0 mm) -->
    <rect x="620" y="480" width="24" height="90" fill="#F59E0B" opacity="0.15" />
    <line x1="620" y1="520" x2="644" y2="520" class="rib-line" marker-start="url(#arrow-rib)" marker-end="url(#arrow-rib)" />
    <text x="624" y="514" class="rib-text" font-size="9">12mm</text>

    <!-- Outer Dimensions Annotations -->
    <!-- Width 410 mm -->
    <line x1="0" y1="640" x2="820" y2="640" class="dim-solid" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <text x="380" y="658" class="dim-text" font-size="13">410.0 mm (TRAY WIDTH)</text>

    <!-- Depth 310 mm -->
    <line x1="-50" y1="0" x2="-50" y2="620" class="dim-solid" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <text x="-55" y="315" class="dim-text" font-size="13" transform="rotate(-90 -55 315)">310.0 mm (TRAY DEPTH)</text>

    <!-- Tolerance Callout 1: Base -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="180" height="44" rx="4" fill="#161B22" stroke="#388BFD" stroke-width="1" />
      <text x="8" y="18" class="dim-text" fill="#F0F6FC" font-weight="bold">BASE CAVITY FIT</text>
      <text x="8" y="34" class="dim-text" fill="#58A6FF">直徑間隙: +4.0 mm / 徑向: 2.0 mm</text>
    </g>

    <!-- Tolerance Callout 2: Head -->
    <g transform="translate(650, 40)">
      <rect x="0" y="0" width="180" height="44" rx="4" fill="#161B22" stroke="#388BFD" stroke-width="1" />
      <text x="8" y="18" class="dim-text" fill="#F0F6FC" font-weight="bold">HEAD CAVITY FIT</text>
      <text x="8" y="34" class="dim-text" fill="#58A6FF">直徑間隙: +4.0 mm / 徑向: 2.0 mm</text>
    </g>

  </g>

  <!-- Technical Header & Title Block -->
  <g transform="translate(54, 40)">
    <text x="0" y="0" class="text-title">OBJECT/01 模塑紙漿內托與外箱 2D 俯視排樣與隔筋驗算工程圖</text>
    <text x="0" y="22" class="text-sub">DRAWING NO: FLTL-OBJ01-PKG-20261107 · SCALE 1:2.0 · UNIT: MM · PROJECTION: 3RD ANGLE</text>
  </g>

  <!-- Technical Footer & Status Block -->
  <g transform="translate(54, 860)">
    <rect x="0" y="0" width="1090" height="60" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
    <text x="16" y="24" fill="#F59E0B" font-size="12" font-weight="bold">⚠ DESIGN STATUS: PACKAGING CONCEPT / PENDING TOOLING &amp; DROP TESTING (未打樣未測試)</text>
    <text x="16" y="44" fill="#8B949E" font-size="11">所有型腔間隔筋均已精確驗算：中心橫向隔筋 22.0 mm、立桿間隔 18.0 mm、懸臂間隔 16.0 mm (全部 ≥12.0 mm 標準) · 零幾何碰撞</text>
    <text x="880" y="35" fill="#58A6FF" font-size="13" font-weight="bold" font-family="monospace">CAD VERIFIED PASS</text>
  </g>

</svg>
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS AI // Case Study 2026</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-[#0D0D0E] text-[#EDEDED] overflow-y-auto h-auto min-h-screen">
  <div class="noise-overlay"></div>

  <header class="sticky top-0 z-40 bg-[#0D0D0E]/90 backdrop-blur border-b border-white/10 px-6 py-4 flex justify-between items-center">
    <a href="./index.html" class="mono text-xs text-zinc-400 hover:text-white flex items-center gap-1.5 transition">
      ← BACK TO OS DESKTOP
    </a>
    <span class="mono text-xs text-orange-400">[CASE // 03]</span>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-12 selectable-text">
    <div class="space-y-4 border-b border-white/10 pb-8">
      <div class="inline-block mono text-xs px-2.5 py-1 rounded bg-orange-500/10 text-orange-400 border border-orange-500/20">
        ENTERPRISE SAAS & DESIGN SYSTEM
      </div>
      <h1 class="syne text-4xl md:text-5xl font-extrabold tracking-tight text-white">NEXUS AI SUITE</h1>
      <p class="text-zinc-400 text-base leading-relaxed">
        模組化設計系統與低延遲協同畫布：為百萬級開發者提供零延遲的視覺化 AI 工作流。
      </p>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 pt-4 mono">
        <div class="p-3 bg-zinc-900/60 rounded-lg border border-white/5">
          <div class="text-[10px] text-zinc-500">HANDOFF SPEED</div>
          <div class="text-xl font-bold text-orange-400">+64%</div>
        </div>
        <div class="p-3 bg-zinc-900/60 rounded-lg border border-white/5">
          <div class="text-[10px] text-zinc-500">DAILY ACTIVE</div>
          <div class="text-xl font-bold text-white">120K+</div>
        </div>
        <div class="p-3 bg-zinc-900/60 rounded-lg border border-white/5">
          <div class="text-[10px] text-zinc-500">SYSTEM LATENCY</div>
          <div class="text-xl font-bold text-green-400">&lt; 12ms</div>
        </div>
        <div class="p-3 bg-zinc-900/60 rounded-lg border border-white/5">
          <div class="text-[10px] text-zinc-500">WCAG SCORE</div>
          <div class="text-xl font-bold text-white">AAA</div>
        </div>
      </div>
    </div>

    <section class="py-10 space-y-6">
      <h2 class="mono text-xs uppercase tracking-widest text-zinc-500">// MODULAR DESIGN ARTIFACTS</h2>
      <div class="p-6 rounded-xl bg-zinc-900/40 border border-white/10 space-y-4">
        <p class="text-sm text-zinc-400 leading-relaxed">
          透過將色彩變體收斂並建立自動化輔助功能校驗，消弭了 94% 的前端樣式債務，使跨平台發布週期從 6 週壓縮至 4 週[cite: 11]。
        </p>
      </div>
    </section>
  </main>

  <script>lucide.createIcons();</script>

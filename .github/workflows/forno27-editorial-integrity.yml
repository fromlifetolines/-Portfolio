name: FORNO 27 editorial integrity rendering
on:
  push:
    branches:
      - fix/forno27-editorial-integrity-20261019
    paths:
      - 'brand/forno-27/build_editorial_integrity_v5.py'
      - '.github/workflows/forno27-editorial-integrity.yml'
permissions:
  contents: write
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Build versioned editorial images
        run: python brand/forno-27/build_editorial_integrity_v5.py
      - name: Validate new assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base=Path('brand/forno-27/assets')
          paths=[base/'mockups'/f'shot-{i:02d}-v5.jpg' for i in (1,3,6,7)]
          paths.append(base/'forno-27-contact-sheet-v5.jpg')
          for p in paths:
              assert p.exists() and p.stat().st_size > 100_000, str(p)
              with Image.open(p) as im: im.verify()
              print('VALID',p,p.stat().st_size)
          PY
      - name: Commit only authored replacement assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand/forno-27/assets/mockups/shot-01-v5.jpg brand/forno-27/assets/mockups/shot-03-v5.jpg brand/forno-27/assets/mockups/shot-06-v5.jpg brand/forno-27/assets/mockups/shot-07-v5.jpg brand/forno-27/assets/forno-27-contact-sheet-v5.jpg
          git diff --cached --quiet || git commit -m 'assets(forno27): replace implausible packaging shots with checked photo essays [skip ci]'
          git push origin HEAD:fix/forno27-editorial-integrity-20261019
